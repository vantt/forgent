# core/workflows/group-cognition.yaml — Group Cognition Deliberation Workflow
# Group cognition workflow with divergent sense-making,
# a dialectical debate (two opposed sides and an independent judge), and convergent action synthesis.

id: group-cognition
title: Group Cognition Deliberation Workflow
description: Group cognition workflow with divergent sense-making, a dialectical debate between opposed sides ruled by an independent judge, and convergent action synthesis.

# --- Guide head: what the playbook promises, beside the steps below (the steps are unchanged) ---
kind: playbook
purpose: Sense-making by independent lenses, a dialectical debate with a ruling, then one action synthesis.
must:
  - id: independent-lenses
    guard: independence-blind
    subject: sense-making.settled
    reason: a seat that has read another seat's output is no longer an independent lens
frameDefaults: { dispatches: 3, mutatingDispatches: 0, fallbackPerSeat: 2, deviationsBeforeAsk: 0, rigorFloor: standard }
closure: [action-synthesis.settled]

steps:
  - id: sense-making
    title: Sense Making
    units:
      - id: sense-making-panel
        template:
          capability: group-cognition:explore
          pattern: panel
          seats:
            - { seat: member-1, role: producer }
            - { seat: member-2, role: producer }
            - { seat: member-3, role: producer }
            - { seat: synthesis, role: synthesizer }
          persona: researcher
          objective: Conduct divergent exploration and sense-making across multiple independent researcher perspectives
          blind: true
  - id: dialectical-inquiry
    title: Dialectical Inquiry
    dependsOn: [sense-making]
    units:
      - id: dialectical-critique
        template:
          capability: group-cognition:critique
          pattern: debate
          seats:
            - { seat: thesis, role: producer }
            - { seat: antithesis, role: producer }
            - { seat: judge, role: judge, tier: flagship }
          persona: critic
          objective: >-
            Debate the strongest conclusion of the sense-making reports listed under Context refs. The
            thesis side argues that conclusion, or the strongest current answer when the reports
            disagree. The antithesis side reverses its load-bearing assumptions and argues the best
            opposing answer. Each side then answers the other, and a judge on a third provider family rules.
  - id: action-synthesis
    title: Action Synthesis
    dependsOn: [dialectical-inquiry]
    units:
      - id: synthesize-action
        template:
          capability: group-cognition:synthesize
          pattern: solo
          persona: synthesizer
          objective: >-
            Converge verified evidence and counter-arguments into an actionable synthesis preserving
            principled dissent. The debate's judge ruling (which side holds, which claims fail, the
            decision and what would reverse it) is the basis for the disputed points; keep its reasons and
            any dissent it records instead of re-deciding the debate. Write the verdict in this order. (1) UNRESOLVED FIRST: what is still
            unknown, contested or unsupported, and what would settle it. (2) POSITIONS: each participant's
            position by seat label only, never by role id. (3) AGREEMENT OR SPLIT: say plainly whether they
            agree; if they split, name the split and the sides, and do not average it away or invent
            consensus. (4) WHAT WOULD CHANGE THIS: the conditions under which the conclusion should be
            revisited. (5) ONE NEXT STEP: exactly one concrete action, with its evidence.
