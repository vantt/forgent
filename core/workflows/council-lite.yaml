id: council-lite
title: Council Lens Discussion
description: One independent panel with three task postures and an evidence-led verdict.
# --- Guide head: what the playbook promises, beside the steps below (the steps are unchanged) ---
kind: playbook
purpose: Three independent postures deliberate on a question, then one synthesizer states the verdict.
must:
  - id: independent-positions
    guard: independence-blind
    subject: discussion.settled
    reason: a seat that has read another seat's output is no longer an independent lens
frameDefaults: { dispatches: 1, mutatingDispatches: 0, fallbackPerSeat: 2, deviationsBeforeAsk: 0, rigorFloor: standard }
closure: [discussion.settled]

steps:
  - id: discussion
    title: Independent positions and synthesis
    units:
      - id: deliberate
        template:
          capability: delphi:propose
          pattern: panel
          blind: true
          contextRefs:
            - core/agents/council-assumptions.yaml
            - core/agents/council-ship-maintain.yaml
            - core/agents/council-feedback-loops.yaml
          seats:
            - { seat: assumptions, role: producer }
            - { seat: ship-maintain, role: producer }
            - { seat: feedback-loops, role: producer }
            - { seat: synthesis, role: synthesizer }
          params:
            roleTasks:
              assumptions: >-
                Your task posture is council-assumptions. Read core/agents/council-assumptions.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. First, in a section named
                "Restatement", write in your own words, in at most three lines, the question you are
                answering and what you treat as out of scope; then analyse. {objective}
              ship-maintain: >-
                Your task posture is council-ship-maintain. Read core/agents/council-ship-maintain.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. First, in a section named
                "Restatement", write in your own words, in at most three lines, the question you are
                answering and what you treat as out of scope; then analyse. {objective}
              feedback-loops: >-
                Your task posture is council-feedback-loops. Read core/agents/council-feedback-loops.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. First, in a section named
                "Restatement", write in your own words, in at most three lines, the question you are
                answering and what you treat as out of scope; then analyse. {objective}
              synthesizer: >-
                Read each seat's report in Context refs; do not answer from scratch or adopt a seat's
                posture. Compare the seats' Restatement sections and list any mismatch in what the seats
                took the question to be as unresolved evidence. Report unresolved evidence first, each seat's explicit position, agreement or
                genuine split without inventing consensus, conditions that would change the verdict,
                and exactly one concrete next step. Do not change repository files. {objective}
          objective: Compare the viable options for the requested question using the supplied evidence.
