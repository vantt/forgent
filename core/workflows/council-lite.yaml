id: council-lite
title: Council Lens Discussion
description: One independent panel with three task postures and an evidence-led verdict.
steps:
  - id: discussion
    title: Independent positions and synthesis
    units:
      - id: deliberate
        template:
          capability: delphi:propose
          pattern: panel
          blind: true
          contextRefs:
            - core/agents/council-assumptions.yaml
            - core/agents/council-ship-maintain.yaml
            - core/agents/council-feedback-loops.yaml
          params:
            members: 3
            roleTasks:
              panelist-1: >-
                Your task posture is council-assumptions. Read core/agents/council-assumptions.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. {objective}
              panelist-2: >-
                Your task posture is council-ship-maintain. Read core/agents/council-ship-maintain.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. {objective}
              panelist-3: >-
                Your task posture is council-feedback-loops. Read core/agents/council-feedback-loops.yaml
                from Context refs and apply its description, method, blind spot, and ending rule.
                This is a task posture, not an actor identity or provider choice. Do not apply the
                other seats' postures. Do not change repository files. {objective}
              synthesizer: >-
                Read each panelist report in Context refs; do not answer from scratch or adopt a seat's
                posture. Report unresolved evidence first, each seat's explicit position, agreement or
                genuine split without inventing consensus, conditions that would change the verdict,
                and exactly one concrete next step. Do not change repository files. {objective}
          objective: Compare the viable options for the requested question using the supplied evidence.
