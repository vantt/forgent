# core/coordination-protocols/standalone-master-coordination-loop.yaml --
# static CoordinationProtocol FlowDefinition fixture for the standalone
# Master Coordination loop: a plan/artifact enters a declared worker graph
# (Doer, Reviewer, Red-Team, Fixer) that produces a candidate, reviews and
# red-teams it in a required first pass, then declares a revision and
# recheck position for a later round. Normalizes through the real,
# unmodified `validateFlowDefinition` (src/runner/definitions/schema.mjs)
# via `discoverCoordinationProtocols`/`loadCoordinationProtocol`
# (src/runner/definitions/protocol-loader.mjs) -- same discovery path as
# declared-consult.yaml/independent-research-fan-out-fan-in.yaml/
# group-cognition-framework.yaml. Does NOT execute or wire into
# CoordinationSession here -- this is the static skeleton only.
#
# No `spec.actors[]` entry declares a `coordinator`/`driver` role. The
# external coordinator that opens a session, reads evidence, authorizes
# optional rounds, and records disposition is durable authority outside
# this declared worker graph, never a worker actor inside it.
#
# No `spec.profile.topology` is declared. Doer/Reviewer/Red-Team/Fixer
# operations here are root operations over explicit artifact/context refs
# passed into the session, not topology-connected SessionActors passing
# turns to each other -- an artifact/diff is not itself a SessionActor.
#
# `revise-candidate`, `reviewer-recheck`, and `red-team-recheck` are the
# optional positions of this loop: each binding declares
# `activation.mode: driver-authorized`, so none of them can materialize an
# Assignment without a matching `operation-authorized` event issued by the
# session's own driver. The first pass
# (`produce-candidate`/`review-candidate`/`red-team-candidate`) stays
# `required` -- it is what always runs, and it is what the driver reads
# before deciding whether a revision round is warranted at all.

apiVersion: fgos.dev/v1alpha1
kind: FlowDefinition
metadata:
  id: core.coordination-protocol.standalone-master-coordination-loop
  version: 1.0.0

spec:
  profile:
    kind: CoordinationProtocol

  roles:
    - doer
    - reviewer
    - red-team
    - fixer

  actors:
    - id: doer
      role: doer
    - id: reviewer
      role: reviewer
    - id: red-team
      role: red-team
    - id: fixer
      role: fixer

  # Phase 03 (Step 09 P03.1) R2-R6: `policy.minTier` per operation is the
  # ONLY portable lever that actually changes dispatch resolution outcome
  # for this fixture's own (non-cohort) materialization path
  # (`dispatchDeclaredOperation` -> `resolveAssignmentDispatchPolicy`,
  # `src/runner/dispatch/assignment-policy.mjs`) -- `capabilities[]` is
  # deliberately NOT declared here: per flow-definition.md's own Operation
  # Primitive table ("stored and validated, does not resolve execution
  # infrastructure directly") it is read only by the Cohort Planner
  # (`cohort-planner.mjs`'s `planCohort`, candidate-matching for a
  # `spec.profile.cohort` allocation), and this fixture declares no
  # `profile.topology`/`profile.cohort` at all -- adding it here would be
  # inert metadata with nothing to prove via a real dispatch test (P03.1.md
  # R1 audit). `preferExecutor` (e.g. pinning the read-only-scoped
  # `executors.claude-reviewer` config entry for Reviewer/Red-Team) is
  # deliberately NOT declared here either -- `assertNoPortableExecutorPin`
  # (session-engine.mjs) refuses a literal executor pin at this portable
  # operation/role/actor/definition scope by design (flow-definition.md
  # PolicyPatch: "a portable ... definition expresses requirements ...
  # never literal executor/model pins"); that selection belongs to a
  # trusted per-dispatch-call scope (`assignmentPolicy`/`cliPolicy`, or a
  # `kind:"declared-protocol"` request's own `actors[].executor` field,
  # `src/verbs/coordination/schema.mjs`) supplied by whichever driver
  # invokes this fixture -- see P03.1.md's Final Intended Mapping for the
  # concrete recommendation left for that caller (Phase 04's own scope, not
  # this cell's).
  operations:
    - id: produce-candidate
      role: doer
      policy:
        minTier: standard
      result:
        kind: work-product
        evidenceRequired: reported
    - id: review-candidate
      role: reviewer
      policy:
        minTier: analytical
      result:
        kind: advisory
        evidenceRequired: reported
    - id: red-team-candidate
      role: red-team
      policy:
        minTier: analytical
      result:
        kind: advisory
        evidenceRequired: reported
    - id: revise-candidate
      role: fixer
      policy:
        minTier: standard
      result:
        kind: work-product
        evidenceRequired: reported
    - id: reviewer-recheck
      role: reviewer
      policy:
        minTier: analytical
      result:
        kind: advisory
        evidenceRequired: reported
    - id: red-team-recheck
      role: red-team
      policy:
        minTier: analytical
      result:
        kind: advisory
        evidenceRequired: reported

  graph:
    entry: phase-produce
    nodes:
      - id: phase-produce
        operations:
          - ref: produce-candidate
            actor: doer
        transitions: [phase-first-pass]
      - id: phase-first-pass
        operations:
          - ref: review-candidate
            actor: reviewer
          - ref: red-team-candidate
            actor: red-team
        transitions: [phase-revision]
      - id: phase-revision
        operations:
          - ref: revise-candidate
            actor: fixer
            activation:
              mode: driver-authorized
        transitions: [phase-recheck]
      - id: phase-recheck
        operations:
          - ref: reviewer-recheck
            actor: reviewer
            activation:
              mode: driver-authorized
          - ref: red-team-recheck
            actor: red-team
            activation:
              mode: driver-authorized
        transitions: []
