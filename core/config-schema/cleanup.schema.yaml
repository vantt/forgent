$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:cleanup:v1
$comment: "owner: work-state"
description: "When delivered work items have their worktree and branch reclaimed."
type: object
properties:
  ttlDays:
    description: Days a delivered root work item waits before the cleanup stage reclaims its worktree and branch.
    type: integer
  leafTtlDays:
    description: Days a delivered child work item waits before cleanup; 0 reclaims at once because its content already lives on the root branch.
    type: integer
