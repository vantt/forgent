$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:secrets:v1
$comment: "owner: secrets. The file keeps declarations as a map keyed by name (secrets.declarations.<name>.consumers); the Secrets crate's Registry::new takes a list of Declaration, so the map is converted at the seam where Config feeds Secrets."
description: "Where secret declarations, source files and enabled sources live; no value is ever held here."
type: object
properties:
  declarations:
    description: The declarations of the secrets this project uses, keyed by secret name; names only, safe to commit.
    type: object
    additionalProperties:
      type: object
      description: One declared secret.
      properties:
        source:
          description: The secret source adapter that holds the value.
          type: string
        consumers:
          description: The executors or providers allowed to receive the secret; a resolve for any other consumer is refused.
          type: array
          items:
            type: string
          x-fgos-scope: global-only
        redact:
          description: Always true in this version; the name and a derived marker go to the redaction list.
          type: boolean
          const: true
        loginStore:
          description: The CLI whose login store receives the secret at lease time.
          type: string
  projectFile:
    description: The project source file, relative to the project root.
    type: string
  globalFile:
    description: The global source file, a path under the user's fgOS directory.
    type: string
    x-fgos-scope: global-only
  sources:
    description: The enabled secret source adapters, in the order they are asked.
    type: array
    items:
      type: string
    x-fgos-scope: global-only
