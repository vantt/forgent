$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:eventStore:v2
$comment: "owner: event-store"
description: "Remote, timers and retry limit of the event store."
type: object
properties:
  remote:
    description: Name of the git remote the event store publishes to and fetches from; letters, digits, underscore and hyphen only.
    type: string
    pattern: "^[A-Za-z0-9_-]+$"
  seal:
    description: The seal timer of the event store.
    type: object
    properties:
      intervalSec:
        description: Seconds between seals of the open event segment.
        type: integer
        minimum: 1
      coalesceSec:
        description: Seconds a lifecycle seal waits for more events of the same unit of work before it seals them as one.
        type: integer
        minimum: 1
  sync:
    description: The sync timer of the event store.
    type: object
    properties:
      intervalSec:
        description: Seconds between syncs with the remote; 0 turns the timer off.
        type: integer
        minimum: 0
  rebuild:
    description: The rebuild limit of the event store.
    type: object
    properties:
      maxAttempts:
        description: Most attempts to rebuild the projection before giving up; 0 means no attempt.
        type: integer
        minimum: 0
