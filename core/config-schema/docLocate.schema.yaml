$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:docLocate:v1
$comment: "owner: documentation"
description: "Where `fgos doc locate` gets its embedding model."
type: object
properties:
  modelSource:
    description: Where `fgos doctor --fix` fetches the embedding model from, `huggingface`, an `https://` mirror root with the same file layout, or a local folder holding the model files for an offline install.
    type: string
    minLength: 1
    not:
      pattern: "^http://"
