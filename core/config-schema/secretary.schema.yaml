$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:secretary:v1
$comment: "owner: supervision"
description: "The secretary head (Miu) and the ceilings of the units she runs herself through the request socket."
type: object
properties:
  run:
    description: Ceilings of a unit the secretary runs herself.
    type: object
    x-fgos-scope: both
    properties:
      maxMinutes:
        description: Longest wall-clock time one unit the secretary runs herself may take. In minutes.
        type: integer
        minimum: 1
        maximum: 240
        x-fgos-scope: both
      tier:
        description: Model tier of a unit the secretary runs herself.
        type: string
        enum: [nano, mini, standard, advanced, flagship, frontier]
        x-fgos-scope: both
