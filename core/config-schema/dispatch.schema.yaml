$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:dispatch:v1
$comment: "owner: run-supervisor"
description: "Waits of the run supervisor when an agent or a controller is asked to stop, the schedule of the account probe sweep, and the thresholds of the attention view."
type: object
properties:
  gateKillGraceMs:
    description: "Milliseconds between the SIGTERM and the SIGKILL of a launch gate that does not stop. In milliseconds."
    type: integer
    minimum: 1000
    x-fgos-scope: both
    x-fgos-file: config
  cancelWaitMs:
    description: "Milliseconds a controller stopped by Ctrl-C or SIGTERM waits for the receipts of its attempts; keep it at least gateKillGraceMs, or the controller leaves before the gate can finish stopping the agent. In milliseconds."
    type: integer
    minimum: 1000
    x-fgos-scope: both
    x-fgos-file: config
  probeAccount:
    description: "The scheduled account probe: an OS timer that runs fgos dispatch probe-account --all --record --leg direct."
    type: object
    properties:
      intervalSec:
        description: "Seconds between sweeps of the scheduled account probe; 0 turns the timer off."
        type: integer
        minimum: 0
        x-fgos-scope: both
        x-fgos-file: config
  attention:
    description: "Thresholds of the attention view's detection definitions (core/attention/definitions)."
    type: object
    properties:
      planNoProgressMinutes:
        description: "Minutes a running plan may show no commit, board entry or run attempt before the attention view raises plan-no-progress."
        type: integer
        minimum: 1
        x-fgos-scope: both
        x-fgos-file: config
