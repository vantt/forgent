$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:fgos:config-schema:runner:v2"
$comment: "owner: runner"
description: "The runner: executors, capabilities, model policies, tier fallback, patterns and run limits."
type: object
properties:
  executor:
    $comment: "justification: read from the trusted main checkout, spec section 5 rule 6; the entry decides what runs on this machine"
    x-fgos-scope: both
    x-fgos-sensitivity: command
    x-fgos-absent: detected
    description: "The default executor a run spawns when no capability names one; detected from PATH when the project names none."
    type: object
    properties:
      command:
        x-fgos-scope: global-only
        description: "The program to spawn."
        type: string
        pattern: "\\S"
      args:
        x-fgos-scope: global-only
        description: "Arguments of the program; {prompt} and {model} are replaced at launch."
        type: array
        items:
          type: string
      adapter:
        $ref: "#/$defs/adapterName"
      env:
        $ref: "#/$defs/envMap"
    required: [command, args]
  executors:
    description: "The executor registry: every executor a seat can be bound to, by id."
    type: object
    additionalProperties:
      $ref: "#/$defs/executorEntry"
  capabilities:
    description: "The capability catalog: what each capability is called, which executors serve it and how it is held."
    type: object
    additionalProperties:
      $ref: "#/$defs/capability"
  modelPolicies:
    description: "The model each family uses at each tier, by family then tier.\nTier ladder, weakest first:\nnano: mechanical, no reasoning; self-check: only recognizes or transforms by pattern?; e.g. classify, extract, format, route, vote\nmini: light reasoning over the given input, narrow scope; self-check: enough information, only understand and summarize?; e.g. summarize, answer from a given document, small exact fix, review a small diff\nstandard: follows an existing plan, many steps; self-check: is there a plan with detailed instructions?; e.g. code to a plan, write tests, refactor as described\nadvanced: finds its own way, no ready answer; self-check: must investigate and decide how?; e.g. hard debugging, complex code, many files with no plan\nflagship: judgment, design, critique; self-check: is the result an opinion or a design?; e.g. review, red-team, solution design, panel synthesis\nfrontier: the costliest decisions; self-check: hard to reverse, costly if wrong?; e.g. architecture lock-in, final synthesis of an important council"
    type: object
    additionalProperties:
      description: "The tiers of one family; a tier it omits has no model."
      type: object
      additionalProperties: false
      properties:
        nano:
          $ref: "#/$defs/tierCell"
        mini:
          $ref: "#/$defs/tierCell"
        standard:
          $ref: "#/$defs/tierCell"
        advanced:
          $ref: "#/$defs/tierCell"
        flagship:
          $ref: "#/$defs/tierCell"
        frontier:
          $ref: "#/$defs/tierCell"
  tierFallback:
    description: "The families a seat walks after a failure, per tier and in order.\nTier ladder, weakest first:\nnano: mechanical, no reasoning; self-check: only recognizes or transforms by pattern?; e.g. classify, extract, format, route, vote\nmini: light reasoning over the given input, narrow scope; self-check: enough information, only understand and summarize?; e.g. summarize, answer from a given document, small exact fix, review a small diff\nstandard: follows an existing plan, many steps; self-check: is there a plan with detailed instructions?; e.g. code to a plan, write tests, refactor as described\nadvanced: finds its own way, no ready answer; self-check: must investigate and decide how?; e.g. hard debugging, complex code, many files with no plan\nflagship: judgment, design, critique; self-check: is the result an opinion or a design?; e.g. review, red-team, solution design, panel synthesis\nfrontier: the costliest decisions; self-check: hard to reverse, costly if wrong?; e.g. architecture lock-in, final synthesis of an important council"
    type: object
    additionalProperties: false
    properties:
      nano:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
      mini:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
      standard:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
      advanced:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
      flagship:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
      frontier:
        description: "Families tried in this order after the primary fails."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
        uniqueItems: true
  maxTier:
    description: "The highest tier any seat may run at; absent means no ceiling.\nTier ladder, weakest first:\nnano: mechanical, no reasoning; self-check: only recognizes or transforms by pattern?; e.g. classify, extract, format, route, vote\nmini: light reasoning over the given input, narrow scope; self-check: enough information, only understand and summarize?; e.g. summarize, answer from a given document, small exact fix, review a small diff\nstandard: follows an existing plan, many steps; self-check: is there a plan with detailed instructions?; e.g. code to a plan, write tests, refactor as described\nadvanced: finds its own way, no ready answer; self-check: must investigate and decide how?; e.g. hard debugging, complex code, many files with no plan\nflagship: judgment, design, critique; self-check: is the result an opinion or a design?; e.g. review, red-team, solution design, panel synthesis\nfrontier: the costliest decisions; self-check: hard to reverse, costly if wrong?; e.g. architecture lock-in, final synthesis of an important council"
    type: string
    enum: [nano, mini, standard, advanced, flagship, frontier]
  defaults:
    description: "What a seat runs at when nothing else names it."
    type: object
    additionalProperties: false
    properties:
      tier:
        description: "The tier a seat runs at when nothing else names one."
        type: string
        enum: [nano, mini, standard, advanced, flagship, frontier]
  timeoutMs:
    description: "Milliseconds one run may take before it is stopped."
    type: number
    exclusiveMinimum: 0
    maximum: 14400000
  idleTimeoutMs:
    description: "Milliseconds of silence after which a worker is stopped; absent leaves idle stopping off."
    type: number
    exclusiveMinimum: 0
  parallel:
    description: "How many units run at once."
    type: object
    properties:
      maxRoots:
        description: "Most root work items running at once."
        type: integer
        minimum: 1
      maxLeavesPerRoot:
        description: "Most leaf work items running at once under one root."
        type: integer
        minimum: 1
  confinement:
    description: "Runner-wide confinement setting."
    type: object
    additionalProperties: false
    properties:
      strict:
        x-fgos-merge: tighten
        description: "When true every capability must declare its own confinement."
        type: boolean
  confinementPolicies:
    $comment: "justification: a policy decides what a confined session may do on this machine, so only the machine's own file defines one; a project could otherwise define a weak policy and require it"
    x-fgos-scope: global-only
    x-fgos-sensitivity: command
    description: "Custom confinement policies by name; a built-in policy name cannot be redefined."
    type: object
    additionalProperties:
      description: "One confinement policy: its contract, controls, grants and network filter."
      type: object
  coordination:
    description: "Settings of agent coordination."
    type: object
    properties:
      orgPolicy:
        description: "The organisation policy of coordination."
        type: object
        properties:
          dischargeOn:
            description: "Outcomes that discharge an obligation."
            type: array
            items:
              type: string
              pattern: "\\S"
  loops:
    description: "Tuning and bounds of the execution loops."
    type: object
    properties:
      solo:
        description: "Tuning and bounds of the solo loop."
        type: object
        additionalProperties: false
        properties:
          bounds:
            $ref: "#/$defs/loopBounds"
      reviewed:
        description: "Tuning and bounds of the reviewed loop."
        type: object
        additionalProperties: false
        properties:
          maxRounds:
            description: "Most review rounds before the unit stops."
            type: integer
            minimum: 1
          checkersByRigor:
            description: "The checker seats per rigor; each rigor includes the checkers of the weaker ones."
            type: object
            additionalProperties: false
            properties:
              low:
                description: "Checker seats at this rigor."
                type: array
                items:
                  description: "Checker seat name."
                  type: string
                  enum: [reviewer, red-team, tester]
              standard:
                description: "Checker seats at this rigor."
                type: array
                items:
                  description: "Checker seat name."
                  type: string
                  enum: [reviewer, red-team, tester]
              high:
                description: "Checker seats at this rigor."
                type: array
                items:
                  description: "Checker seat name."
                  type: string
                  enum: [reviewer, red-team, tester]
              critical:
                description: "Checker seats at this rigor."
                type: array
                items:
                  description: "Checker seat name."
                  type: string
                  enum: [reviewer, red-team, tester]
          bounds:
            $ref: "#/$defs/loopBounds"
      panel:
        description: "Tuning and bounds of the panel loop."
        type: object
        additionalProperties: false
        properties:
          bounds:
            $ref: "#/$defs/loopBounds"
      debate:
        description: "Tuning and bounds of the debate loop."
        type: object
        additionalProperties: false
        properties:
          bounds:
            $ref: "#/$defs/loopBounds"
    additionalProperties: false
  patterns:
    description: "Settings of the collaboration patterns."
    type: object
    x-fgos-merge: deep
    properties:
      seatBinding:
        description: "Marker that this project reads the seat binding form of the config."
        type: object
        additionalProperties: false
        properties:
          schema:
            description: "Version of the seat binding form; this release writes 2 and reads 1 and 2."
            type: integer
            enum: [1, 2]
    additionalProperties:
      $ref: "#/$defs/patternEntry"
  generatedPaths:
    description: "Generated trees a unit write scope widens to when it touches their source."
    type: array
    items:
      description: "One source scope entry and the render targets generated from it."
      type: object
      additionalProperties: false
      properties:
        from:
          description: "Source write-scope entry, starting with a literal directory."
          type: string
          pattern: "\\S"
        also:
          description: "Render targets that follow the source."
          type: array
          items:
            type: string
            pattern: "\\S"
          minItems: 1
      required: [from, also]
  llmAccounts:
    x-fgos-file: accounts
    x-fgos-scope: global-only
    x-fgos-sensitivity: secret-reference
    description: "The account pools by pool name then account id; each account names the login directory of each CLI. Lives in the accounts file."
    type: object
    additionalProperties:
      description: "One pool: its accounts in the order they are leased."
      type: object
      additionalProperties:
        description: "One account."
        type: object
        properties:
          credentialStore:
            description: "Login directory per CLI name."
            type: object
            additionalProperties:
              description: "Absolute directory, or one starting with ~ or ${HOME}."
              type: string
              minLength: 1
          label:
            description: "Name shown in reports."
            type: string
            minLength: 1
          disabled:
            description: "Whether the account is out of rotation."
            type: boolean
  providers:
    description: "Older account inventory by provider; read only until every release reads llmAccounts."
    type: object
    additionalProperties:
      description: "One provider."
      type: object
      properties:
        accounts:
          x-fgos-file: accounts
          x-fgos-scope: global-only
          x-fgos-sensitivity: secret-reference
          description: "The accounts of the provider by id, in the order they are leased. Lives in the accounts file."
          type: object
          additionalProperties:
            description: "One account."
            type: object
            properties:
              label:
                description: "Name shown in reports."
                type: string
                minLength: 1
              credentialSource:
                $ref: "#/$defs/accountSource"
              credentialSources:
                description: "Login store per CLI command name."
                type: object
                additionalProperties:
                  $ref: "#/$defs/accountSource"
$defs:
  tierName:
    description: "One tier of the model ladder."
    type: string
    enum: [nano, mini, standard, advanced, flagship, frontier]
  preferList:
    description: "Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider."
    type: [string, array]
    pattern: "\\S"
    minItems: 1
    items:
      type: [string, object]
      pattern: "\\S"
      additionalProperties: false
      properties:
        executor:
          description: "Executor id."
          type: string
          pattern: "\\S"
        invocation:
          description: "Id of one invocation of that executor."
          type: string
          pattern: "\\S"
        crossProvider:
          description: "Whether the seat may use this executor across provider families."
          type: boolean
      required: [executor]
  tierEntry:
    description: "One model of a tier cell: a model id, model@pool (split at the last @, so a model id may itself contain @), or an object with model, pool and effort."
    additionalProperties: false
    properties:
      model:
        description: "Model id."
        type: string
        pattern: "\\S"
      pool:
        description: "Account pool that serves the model."
        type: string
        pattern: "\\S"
      effort:
        description: "Reasoning effort sent with the model."
        type: string
        enum: [low, medium, high, max]
    oneOf:
      - description: "A model id."
        type: string
        pattern: "^[^@]+$"
      - description: "A model id and the pool that serves it, joined by the last @."
        type: string
        pattern: "^.+@[^@]+$"
      - description: "A model with its pool and reasoning effort."
        type: object
        required: [model]
  tierCell:
    description: "The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged."
    x-fgos-merge: leaf
    properties:
      model:
        description: "Model id."
        type: string
        pattern: "\\S"
      pool:
        description: "Account pool that serves the model."
        type: string
        pattern: "\\S"
      effort:
        description: "Reasoning effort sent with the model."
        type: string
        enum: [low, medium, high, max]
    items:
      $ref: "#/$defs/tierEntry"
    oneOf:
      - $ref: "#/$defs/tierEntry"
      - description: "A non-empty list of entries."
        type: array
        minItems: 1
  seatTaste:
    description: "The tier and executors one role, persona or seat prefers."
    type: object
    additionalProperties: false
    properties:
      tier:
        $ref: "#/$defs/tierName"
      prefer:
        $ref: "#/$defs/preferList"
  capabilityConfinement:
    $comment: "justification: read from the trusted main checkout, spec section 5 rule 6; the entry decides what runs on this machine"
    x-fgos-scope: both
    x-fgos-sensitivity: command
    x-fgos-merge: tighten
    description: "How a capability is confined: required or preferred names a confinement policy, unconfined runs without one. A higher layer replaces the whole entry, so an unconfined entry never inherits a lower layer's policy. A project file may equal or raise the confinement of the layers beneath it (required over preferred over unconfined), never lower it; a policy other than the lower layer's counts as lowering."
    type: object
    properties:
      mode:
        description: "required fails without the policy, preferred uses it when it can, unconfined runs outside any policy."
        type: string
        enum: [required, preferred, unconfined]
      policy:
        description: "Name of the confinement policy; absent only when mode is unconfined."
        type: string
        pattern: "\\S"
      allowInvocationOverride:
        description: "Whether an invocation may replace the policy; must be false when mode is unconfined."
        type: boolean
    required: [mode]
  capability:
    $comment: "Keys that no longer exist are refused as unknown: overrides (set rigor for the floor rigor, or configure the executors), unconfined (write confinement with mode unconfined)."
    description: "One capability: what it is called, which executors serve it and how work on it is held."
    type: object
    additionalProperties: false
    properties:
      description:
        description: "What the capability is for."
        type: string
        pattern: "\\S"
      aliases:
        x-fgos-scope: global-only
        description: "Other names the capability answers to."
        type: array
        items:
          type: string
          pattern: "\\S"
      prefer:
        $ref: "#/$defs/preferList"
      rigor:
        description: "Floor rigor a unit of this capability runs at."
        type: string
        enum: [low, standard, high, critical]
      persona:
        description: "Agent persona a seat of this capability takes."
        type: string
        pattern: "\\S"
      minCheckers:
        description: "Checker seats a reviewed unit of this capability needs at least."
        type: array
        items:
          type: string
          enum: [reviewer, red-team, tester]
      verify:
        $comment: "justification: read from the trusted main checkout, spec section 5 rule 6; the entry decides what runs on this machine"
        x-fgos-scope: both
        x-fgos-sensitivity: command
        description: "Shell command that verifies work of this capability."
        type: string
        pattern: "\\S"
      serves:
        description: "Attributes of the work this capability serves; each value is one scalar or a list of them."
        type: object
        additionalProperties: false
        properties:
          outputKind:
            description: "Kind of output the work produces."
            type: [string, array]
            pattern: "\\S"
            minItems: 1
            items:
              type: string
              pattern: "\\S"
          domain:
            description: "Domain the work belongs to."
            type: [string, array]
            pattern: "\\S"
            minItems: 1
            items:
              type: string
              pattern: "\\S"
          mutates:
            description: "Whether the work changes files."
            type: [boolean, array]
            minItems: 1
            items:
              type: boolean
          behaviorPreserving:
            description: "Whether the work keeps behaviour unchanged."
            type: [boolean, array]
            minItems: 1
            items:
              type: boolean
          needsIndependentReview:
            description: "Whether the work needs a reviewer other than its producer."
            type: [boolean, array]
            minItems: 1
            items:
              type: boolean
          hasPlanOrTrack:
            description: "Whether the work follows a plan or track."
            type: [boolean, array]
            minItems: 1
            items:
              type: boolean
      confinement:
        $ref: "#/$defs/capabilityConfinement"
      tier:
        $ref: "#/$defs/tierName"
        x-fgos-scope: project-only
      maxTier:
        $ref: "#/$defs/tierName"
        x-fgos-scope: project-only
      roles:
        description: "Per-role tier and executor taste; a role is producer, synthesizer, reviewer, red-team or judge."
        type: object
        additionalProperties: false
        properties:
          producer:
            $ref: "#/$defs/seatTaste"
          synthesizer:
            $ref: "#/$defs/seatTaste"
          reviewer:
            $ref: "#/$defs/seatTaste"
          red-team:
            $ref: "#/$defs/seatTaste"
          judge:
            $ref: "#/$defs/seatTaste"
        x-fgos-scope: project-only
      personas:
        description: "Per-persona tier and executor taste."
        type: object
        additionalProperties:
          $ref: "#/$defs/seatTaste"
        x-fgos-scope: project-only
      seats:
        description: "Per-seat tier and executor taste."
        type: object
        additionalProperties:
          $ref: "#/$defs/seatTaste"
        x-fgos-scope: project-only
  adapterName:
    description: "The adapters that can spawn an executor."
    type: string
    enum: [cli-spawn, herdr-spawn, paseo-spawn]
  envMap:
    description: "Environment variables of a launch, by name."
    type: object
    propertyNames:
      pattern: "\\S"
    additionalProperties:
      description: "Value of the variable."
      type: string
  launchConfinement:
    description: "Confinement of a launch: a backend, the three isolation flags and the policy parts. A key outside these is refused; sessionName was removed because a worker always goes to the one fgOS worker session."
    type: object
    additionalProperties: false
    properties:
      backend:
        x-fgos-scope: global-only
        description: "Name of the confinement backend that wraps the launch."
        type: string
        pattern: "\\S"
      privateHome:
        x-fgos-scope: global-only
        description: "Whether the worker gets a private home."
        type: boolean
      isolatedSession:
        x-fgos-scope: global-only
        description: "Whether the worker gets an isolated session."
        type: boolean
      ownWorktree:
        x-fgos-merge: tighten
        description: "Whether the worker gets its own worktree. A project file may turn it on but never off over a lower layer that turned it on; to run one project without it the machine owner defines a second executor with false in the global file and the project prefers that executor."
        type: boolean
      contract:
        description: "Confinement contract reference."
        type: string
      controls:
        x-fgos-scope: global-only
        description: "Confinement controls by axis."
        type: object
      grants:
        description: "Resource grants of the launch."
        type: array
      networkFilter:
        description: "Network allowlist of the launch."
        type: object
  interactiveMode:
    description: "How a herdr pane runs the CLI interactively."
    type: object
    properties:
      exitCommand:
        description: "Command typed to leave the CLI."
        type: string
        pattern: "\\S"
      kind:
        description: "The agent kind herdr starts: a lowercase name; herdr refuses one it does not know."
        type: string
        pattern: "^[a-z][a-z0-9_-]*$"
      trustStore:
        description: "Which trust store the CLI keeps; null for none."
        type: [object, "null"]
        properties:
          kind:
            description: "Trust store format."
            type: string
            enum: [claude-json, codex-toml, agy, agy-json]
          path:
            description: "Path of the trust store."
            type: string
            pattern: "\\S"
        required: [kind]
    required: [exitCommand]
  invocation:
    description: "One way to run an executor: through a CLI, a task or an MCP tool."
    type: object
    properties:
      id:
        description: "Name of the invocation, unique within its executor."
        type: string
        pattern: "\\S"
      via:
        description: "How the invocation runs."
        type: string
        enum: [cli, task, mcp]
      adapter:
        $ref: "#/$defs/adapterName"
      command:
        x-fgos-scope: global-only
        description: "The program to spawn, or for an MCP invocation its identifier."
        type: string
        pattern: "\\S"
      args:
        x-fgos-scope: global-only
        description: "Arguments of the program; {prompt} and {model} are replaced at launch."
        type: array
        items:
          type: string
      tools:
        description: "For an MCP invocation, the tool that serves each capability."
        type: object
        additionalProperties:
          description: "MCP tool identifier."
          type: string
          pattern: "\\S"
      env:
        $ref: "#/$defs/envMap"
      permissionMode:
        x-fgos-scope: global-only
        description: "Whether the worker asks before acting; bypass needs full confinement."
        type: string
        enum: [ask, bypass]
      promptDelivery:
        description: "How the prompt reaches the worker."
        type: string
        enum: [file-pointer, inline]
      confinement:
        $ref: "#/$defs/launchConfinement"
      credentialStore:
        description: "The login store of the CLI, handed to the confined launch through its private home."
        type: object
        properties:
          use:
            description: "Name of the login store, a lowercase key such as codex or pi."
            type: string
            pattern: "\\S"
          homeEnv:
            description: "Environment variable that points the CLI at its home."
            type: string
            pattern: "\\S"
          files:
            description: "Login files copied into the private home, relative paths without parent steps."
            type: array
            items:
              type: string
              pattern: "\\S"
            minItems: 1
          sessionDir:
            description: "Folder of the private home where the CLI writes its session, relative and without parent steps. Execution copies it into the run directory before it removes the home; without it no transcript is kept. Check where a CLI writes with `fgos dispatch probe-session <executorId>`."
            type: string
            pattern: "\\S"
        required: [use, homeEnv]
      interactiveMode:
        $ref: "#/$defs/interactiveMode"
      liveOutput:
        description: "How output is streamed while the worker runs."
        type: object
        properties:
          streamFlags:
            description: "Flags that turn streaming on."
            type: array
            items:
              type: string
          renderer:
            description: "Name of the renderer."
            type: string
            pattern: "\\S"
        required: [streamFlags, renderer]
      resourceBindings:
        description: "Older form of the login store, read only to infer one."
        type: array
    required: [via]
    allOf:
      - if:
          properties:
            via:
              description: "A cli invocation."
              const: cli
        then:
          required: [command, args]
      - if:
          properties:
            via:
              description: "An mcp invocation."
              const: mcp
        then:
          required: [command]
  executorEntry:
    $comment: "justification: read from the trusted main checkout, spec section 5 rule 6; the entry decides what runs on this machine"
    x-fgos-scope: both
    x-fgos-sensitivity: command
    description: "One executor: an agent that runs work or a tool that is only present, with the invocations that start it."
    type: object
    properties:
      kind:
        description: "agent runs work for a seat, tool is only called."
        type: string
        enum: [agent, tool]
      description:
        description: "What the executor is and how its invocations differ."
        type: string
        pattern: "\\S"
      providerModel:
        description: "The model family of the executor, the key of modelPolicies."
        type: string
        pattern: "\\S"
      allowCrossProvider:
        description: "Whether a seat of another provider family may use this executor."
        type: boolean
      forceCliSpawn:
        description: "Spawn through the CLI even where a native task would do."
        type: boolean
      agentType:
        description: "Agent definition a native task runs."
        type: string
        pattern: "\\S"
      model:
        description: "Model of an executor that has its own vocabulary."
        type: string
        pattern: "\\S"
      carries:
        description: "What the executor may be given."
        type: string
        enum: [user-text, repo-content]
      for:
        description: "Capabilities a tool serves."
        type: array
        items:
          type: string
          pattern: "\\S"
        minItems: 1
      scanTarget:
        description: "Directory a tool scans."
        type: string
        pattern: "\\S"
      responsibility:
        description: "The responsibility a tool fills."
        type: string
        pattern: "\\S"
      command:
        x-fgos-scope: global-only
        description: "The program to spawn when the executor has no invocations."
        type: string
        pattern: "\\S"
      args:
        x-fgos-scope: global-only
        description: "Arguments of that program."
        type: array
        items:
          type: string
      adapter:
        $ref: "#/$defs/adapterName"
      env:
        $ref: "#/$defs/envMap"
      permissionMode:
        x-fgos-scope: global-only
        description: "Whether the worker asks before acting."
        type: string
        enum: [ask, bypass]
      promptDelivery:
        description: "How the prompt reaches the worker."
        type: string
        enum: [file-pointer, inline]
      confinement:
        $ref: "#/$defs/launchConfinement"
      interactiveMode:
        $ref: "#/$defs/interactiveMode"
      identity:
        description: "Who the executor is for audit."
        type: object
        properties:
          principalRef:
            description: "Principal the executor acts as."
            type: string
            pattern: "\\S"
          runtimeBackendRef:
            description: "Runtime backend it runs on."
            type: string
            pattern: "\\S"
          trustDomain:
            description: "Trust domain of the executor."
            type: string
            pattern: "\\S"
          egressClass:
            description: "Network egress class of the executor."
            type: string
            pattern: "\\S"
        required: [principalRef, runtimeBackendRef, trustDomain, egressClass]
      supports:
        description: "What the executor can do."
        type: object
        properties:
          providerFamilies:
            description: "Provider families it can serve."
            type: array
            items:
              type: string
              pattern: "\\S"
            minItems: 1
          reasoningEffort:
            description: "Reasoning efforts it accepts."
            type: array
            items:
              type: string
              enum: [low, medium, high, max]
            minItems: 1
          skills:
            description: "Skills it can load."
            type: array
            items:
              type: string
              pattern: "\\S"
            minItems: 1
          systemPrompt:
            description: "Whether it takes a system prompt."
            type: boolean
          toolGating:
            description: "How its tools are gated."
            type: string
            pattern: "\\S"
      invocations:
        description: "The ways to start the executor."
        type: array
        items:
          $ref: "#/$defs/invocation"
        minItems: 1
    required: [kind]
    dependentRequired:
      command: [args]
      args: [command]
  accountSource:
    description: "Where the login of one account lives."
    type: object
    properties:
      kind:
        description: "Kind of login store."
        type: string
        enum: [codex-home, home-files]
      home:
        description: "Directory of the login store."
        type: string
        minLength: 1
      files:
        description: "Files of the login store."
        type: array
        items:
          type: string
  loopBounds:
    description: "Bounds on loop parameters."
    type: object
    additionalProperties:
      description: "Bounds for one parameter: minimum and maximum allowed values."
      type: object
      additionalProperties: false
      properties:
        min:
          description: "Minimum allowed value for this parameter."
          type: integer
        max:
          description: "Maximum allowed value for this parameter."
          type: integer
  patternEntry:
    description: "One collaboration pattern: its promise, loop, defaults and invariants."
    type: object
    additionalProperties: false
    properties:
      promise:
        description: "One-sentence promise of what this pattern delivers."
        type: string
        pattern: "\\S"
      loop:
        description: "The execution loop that runs this pattern."
        type: string
        enum: [solo, reviewed, panel, debate]
      defaults:
        description: "Default parameter values for the loop."
        type: object
        additionalProperties: false
        properties:
          maxRounds:
            description: "Most review rounds before the unit stops."
            type: integer
            minimum: 1
          minCheckers:
            description: "Minimum checker seats required for a review round."
            type: array
            items:
              description: "A checker seat name."
              type: string
              enum: [reviewer, red-team, tester]
          seats:
            description: "Default seat declarations for the loop."
            type: array
            items:
              $ref: "#/$defs/declaredSeat"
          roleTasks:
            description: "Default task instructions per seat or kind."
            type: object
            additionalProperties:
              description: "Task instruction text."
              type: string
              pattern: "\\S"
          rebuttal:
            description: "Whether rebuttal is enabled in debate."
            type: boolean
      invariants:
        description: "Invariants that must not be weakened."
        type: object
        additionalProperties:
          $ref: "#/$defs/patternInvariant"
  declaredSeat:
    description: "One declared seat in a pattern or unit."
    type: object
    additionalProperties: false
    properties:
      seat:
        description: "Unique name of the seat."
        type: string
        pattern: "\\S"
      role:
        description: "Role the seat performs in the loop."
        type: string
        enum: [producer, synthesizer, reviewer, red-team, judge]
      persona:
        description: "Persona specialization for the seat."
        type: string
        pattern: "\\S"
      tier:
        $ref: "#/$defs/tierName"
    required: [seat, role]
  patternInvariant:
    description: "An invariant on one parameter: either atLeast for lists or fixed for exact value."
    type: object
    additionalProperties: false
    properties:
      atLeast:
        description: "List elements that must be present in the effective value."
        type: array
        items:
          description: "Required element."
          type: string
          pattern: "\\S"
      fixed:
        description: "Exact value the parameter must have."
    oneOf:
      - description: "Minimum elements that must be present in a list parameter."
        required: [atLeast]
      - description: "Exact value the parameter must equal."
        required: [fixed]
