$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:fgos:config-schema:terminal:v1
$comment: "owner: terminal-control"
description: "Slot grace, failed-pane retention and pane layout of terminal control."
type: object
# The primitive's default deep merge gives the order project, then global, then standard; a present null counts as set.
properties:
  allocationGraceMs:
    description: Milliseconds a slot may wait for its worker before it is reported as stuck; must exceed the ready timeout by 30000.
    type: integer
    minimum: 1
  retainFailedPaneMs:
    description: Milliseconds a failed pane is kept before it is closed; null keeps it until a person closes it.
    type: [integer, "null"]
    minimum: 1
  layout:
    description: Where new panes are placed and how small they may get.
    type: object
    properties:
      policy:
        description: The placement policy the Rust core registers.
        type: string
        enum: [even-split, measured-split]
      minCols:
        description: Smallest pane width in columns; the agent CLIs were measured to start at 40.
        type: integer
        minimum: 40
      minRows:
        description: Smallest pane height in rows; the agent CLIs were measured to start at 8.
        type: integer
        minimum: 8
      maxPanesPerTab:
        description: Most panes placed in one tab before a new tab is opened.
        type: integer
        minimum: 1
