# @fgos:v1
# see: fgos config standard
# @fgos:doc Where secret declarations, source files and enabled sources live; no value is ever held here.
secrets:
  # @fgos:doc The project source file, relative to the project root. Default: .fgos/secrets.local.env.
  projectFile: .fgos/secrets.local.env
  # @fgos:doc The enabled secret source adapters, in the order they are asked. Default: ["file"].
  sources:
    - file
