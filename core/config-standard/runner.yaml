  # @fgos:doc The model each family uses at each tier, by family then tier. Tier ladder, weakest first: nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote | mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ | standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả | advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan | flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel | frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  modelPolicies:
    claude:
      nano: haiku
      standard: sonnet
      advanced: sonnet
      flagship: opus
      frontier: fable
      mini:
        model: haiku
        effort: high
    gemini:
      nano: gemini-3.8-flash-low
      standard: gemini-3.8-flash-medium
      advanced: gemini-3.8-flash-high
      flagship: gemini-4-argon-high
      frontier: gemini-4-argon-high
      mini: gemini-3.8-flash-low
    openai:
      nano:
        model: gpt-6-luna
        effort: low
      standard: gpt-5.6-terra
      advanced:
        model: gpt-6.1-sol
        effort: medium
      flagship:
        model: gpt-6.1-sol
        effort: high
      frontier: gpt-6-astra
      mini:
        model: gpt-6-luna
        effort: high
    z-ai:
      nano: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
      standard: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
      advanced: "z-ai/glm-5.3@openrouter"
      flagship: "z-ai/glm-5.3@openrouter"
      frontier: "z-ai/glm-5.3@openrouter"
      mini: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
    xai:
      nano: grok-4.3
      standard: grok-4.3
      advanced: grok-4.5
      flagship: grok-4.7
      frontier: grok-4.7
      mini: grok-4.3
    deepseek:
      nano:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
      standard:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
      advanced: "deepseek/deepseek-v4-pro@openrouter"
      flagship: "deepseek/deepseek-v4-pro@openrouter"
      frontier: "deepseek/deepseek-v4-pro@openrouter"
      mini:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
  # @fgos:doc The families a seat walks after a failure, per tier and in order. Tier ladder, weakest first: nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote | mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ | standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả | advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan | flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel | frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  tierFallback:
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    nano: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    standard: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    advanced: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["claude","openai","gemini","xai","deepseek","z-ai"].
    flagship: [claude, openai, gemini, xai, deepseek, z-ai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["claude","openai","gemini","xai","deepseek","z-ai"].
    frontier: [claude, openai, gemini, xai, deepseek, z-ai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    mini: [gemini, deepseek, z-ai, claude, openai]
  # @fgos:doc What a seat runs at when nothing else names it.
  defaults:
    # @fgos:doc The tier a seat runs at when nothing else names one. Values: nano | mini | standard | advanced | flagship | frontier. Default: standard.
    tier: standard
  # @fgos:doc Milliseconds one run may take before it is stopped. Minimum: 60000. Maximum: 14400000. Default: 900000.
  timeoutMs: 900000
  # @fgos:doc How many units run at once.
  parallel:
    # @fgos:doc Most root work items running at once. Minimum: 1. Default: 4.
    maxRoots: 4
    # @fgos:doc Most leaf work items running at once under one root. Minimum: 1. Default: 4.
    maxLeavesPerRoot: 4
  # @fgos:doc Runner-wide confinement setting.
  confinement:
    # @fgos:doc When true every capability must declare its own confinement. Default: false.
    strict: false
  # @fgos:doc Settings of the collaboration patterns.
  patterns:
    # @fgos:doc The rule applied when a pattern names none.
    defaultRule:
      # @fgos:doc Lowest rigor a unit that changes files may run at. Values: low | standard | high | critical. Default: standard.
      mutatingMinRigor: standard
    # @fgos:doc The reviewed pattern: rounds and checkers.
    reviewed:
      # @fgos:doc Most review rounds before the unit stops. Minimum: 1. Default: 2.
      maxRounds: 2
      # @fgos:doc The checker seats per rigor; each rigor includes the checkers of the weaker ones.
      checkersByRigor:
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer"].
        standard: [reviewer]
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer","red-team"].
        high: [reviewer, red-team]
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer","red-team","tester"].
        critical: [reviewer, red-team, tester]
    # @fgos:doc Marker that this project reads the seat binding form of the config.
    seatBinding:
      # @fgos:doc Version of the seat binding form; the only value this release reads is 1. Default: 1.
      schema: 1
  # @fgos:doc Generated trees a unit write scope widens to when it touches their source. Default: [].
  generatedPaths: []
