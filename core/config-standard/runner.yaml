  # @fgos:doc The model each family uses at each tier, by family then tier.
  # @fgos:doc Tier ladder, weakest first:
  # @fgos:doc nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote
  # @fgos:doc mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ
  # @fgos:doc standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả
  # @fgos:doc advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan
  # @fgos:doc flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel
  # @fgos:doc frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  modelPolicies:
    claude:
      nano: haiku
      standard: sonnet
      advanced: sonnet
      flagship: opus
      frontier: fable
      mini:
        model: haiku
        effort: high
    gemini:
      nano: gemini-3.8-flash-low
      standard: gemini-3.8-flash-medium
      advanced: gemini-3.8-flash-high
      flagship: gemini-4-argon-high
      frontier: gemini-4-argon-high
      mini: gemini-3.8-flash-low
    openai:
      nano:
        model: gpt-6-luna
        effort: low
      standard: gpt-5.6-terra
      advanced:
        model: gpt-6.1-sol
        effort: medium
      flagship:
        model: gpt-6.1-sol
        effort: high
      frontier: gpt-6-astra
      mini:
        model: gpt-6-luna
        effort: high
    z-ai:
      nano: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
      standard: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
      advanced: "z-ai/glm-5.3@openrouter"
      flagship: "z-ai/glm-5.3@openrouter"
      frontier: "z-ai/glm-5.3@openrouter"
      mini: ["thehive/zai-org/glm-5.3-flash@thehive", "z-ai/glm-5.3-flash@openrouter"]
    xai:
      nano: grok-4.3
      standard: grok-4.3
      advanced: grok-4.5
      flagship: grok-4.7
      frontier: grok-4.7
      mini: grok-4.3
    deepseek:
      nano:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
      standard:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
      advanced: "deepseek/deepseek-v4-pro@openrouter"
      flagship: "deepseek/deepseek-v4-pro@openrouter"
      frontier: "deepseek/deepseek-v4-pro@openrouter"
      mini:
        - "thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive"
        - "deepseek/deepseek-v4.1-flash@openrouter"
  # @fgos:doc The families a seat walks after a failure, per tier and in order.
  # @fgos:doc Tier ladder, weakest first:
  # @fgos:doc nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote
  # @fgos:doc mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ
  # @fgos:doc standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả
  # @fgos:doc advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan
  # @fgos:doc flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel
  # @fgos:doc frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  tierFallback:
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    nano: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    standard: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    advanced: [gemini, deepseek, z-ai, claude, openai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["claude","openai","gemini","xai","deepseek","z-ai"].
    flagship: [claude, openai, gemini, xai, deepseek, z-ai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["claude","openai","gemini","xai","deepseek","z-ai"].
    frontier: [claude, openai, gemini, xai, deepseek, z-ai]
    # @fgos:doc Families tried in this order after the primary fails. Default: ["gemini","deepseek","z-ai","claude","openai"].
    mini: [gemini, deepseek, z-ai, claude, openai]
  # @fgos:doc What a seat runs at when nothing else names it.
  defaults:
    # @fgos:doc The tier a seat runs at when nothing else names one. Values: nano | mini | standard | advanced | flagship | frontier. Default: standard.
    tier: standard
  # @fgos:doc Milliseconds one run may take before it is stopped. Maximum: 14400000. Default: 900000.
  timeoutMs: 900000
  # @fgos:doc How many units run at once.
  parallel:
    # @fgos:doc Most root work items running at once. Minimum: 1. Default: 4.
    maxRoots: 4
    # @fgos:doc Most leaf work items running at once under one root. Minimum: 1. Default: 4.
    maxLeavesPerRoot: 4
  # @fgos:doc Runner-wide confinement setting.
  confinement:
    # @fgos:doc When true every capability must declare its own confinement. Default: false.
    strict: false
  # @fgos:doc Tuning and bounds of the execution loops.
  loops:
    # @fgos:doc Tuning and bounds of the reviewed loop.
    reviewed:
      # @fgos:doc Most review rounds before the unit stops. Minimum: 1. Default: 2.
      maxRounds: 2
      # @fgos:doc The checker seats per rigor; each rigor includes the checkers of the weaker ones.
      checkersByRigor:
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer"].
        standard: [reviewer]
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer","red-team"].
        high: [reviewer, red-team]
        # @fgos:doc Checker seats at this rigor. Default: ["reviewer","red-team","tester"].
        critical: [reviewer, red-team, tester]
  # @fgos:doc Settings of the collaboration patterns.
  patterns:
    # @fgos:doc Marker that this project reads the seat binding form of the config.
    seatBinding:
      # @fgos:doc Version of the seat binding form; this release writes 2 and reads 1 and 2. Values: 1 | 2. Default: 2.
      schema: 2
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    solo:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: A single worker runs the task to completion..
      promise: "A single worker runs the task to completion."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: solo.
      loop: solo
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    reviewed:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: A producer executes the task followed by checker review rounds until acceptance or budget exhaustion..
      promise: "A producer executes the task followed by checker review rounds until acceptance or budget exhaustion."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: reviewed.
      loop: reviewed
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    panel:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: Multiple independent producers execute the task in parallel and a synthesizer combines their results..
      promise: "Multiple independent producers execute the task in parallel and a synthesizer combines their results."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: panel.
      loop: panel
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    debate:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: Multiple agents debate opposing viewpoints across rounds before reaching a conclusion..
      promise: "Multiple agents debate opposing viewpoints across rounds before reaching a conclusion."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: debate.
      loop: debate
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    code-change:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: A producer changes code with reviewer and red-team review..
      promise: "A producer changes code with reviewer and red-team review."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: reviewed.
      loop: reviewed
      # @fgos:doc Invariants that must not be weakened.
      invariants:
        # @fgos:doc An invariant on one parameter: either atLeast for lists or fixed for exact value.
        minCheckers:
          # @fgos:doc List elements that must be present in the effective value. Default: ["reviewer","red-team"].
          atLeast: [reviewer, red-team]
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    consult:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: An advisor provides specialized guidance without file mutations..
      promise: "An advisor provides specialized guidance without file mutations."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: solo.
      loop: solo
      # @fgos:doc Invariants that must not be weakened.
      invariants:
        # @fgos:doc An invariant on one parameter: either atLeast for lists or fixed for exact value.
        seats:
          # @fgos:doc Exact value the parameter must have. Default: [{"seat":"advisor","role":"producer"}].
          fixed:
            - seat: advisor
              role: producer
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    rfc:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: A document or decision proposal reviewed by a reviewer and red-team against specification..
      promise: "A document or decision proposal reviewed by a reviewer and red-team against specification."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: reviewed.
      loop: reviewed
      # @fgos:doc Invariants that must not be weakened.
      invariants:
        # @fgos:doc An invariant on one parameter: either atLeast for lists or fixed for exact value.
        minCheckers:
          # @fgos:doc List elements that must be present in the effective value. Default: ["reviewer","red-team"].
          atLeast: [reviewer, red-team]
      # @fgos:doc Default parameter values for the loop.
      defaults:
        # @fgos:doc Most review rounds before the unit stops. Minimum: 1. Default: 1.
        maxRounds: 1
        # @fgos:doc Default task instructions per seat or kind.
        roleTasks:
          # @fgos:doc Task instruction text.
          reviewer: |-
            You are the reviewer of a proposal or document another agent just produced. Do not change any file.
            Read the artifact the task names (a path or text in the task itself) and the producer's own account of it, listed under Context refs. Do not look at git history unless the task names a commit.
            Check it against the task below and report what is wrong, unsupported, or missing, with quoted evidence, or say plainly that you found nothing.

            The task that was assigned:
            {objective}
          # @fgos:doc Task instruction text.
          red-team: |-
            You are the red-team for a proposal or document another agent just produced. Do not change any file.
            Read the artifact the task names (a path or text in the task itself) and the producer's own account of it, listed under Context refs. Do not look at git history unless the task names a commit.
            Try to break it: wrong claims, hidden assumptions, missed cases, failure modes, and anything the task forbade. Report concrete failures with quoted evidence, or say plainly that you found none.

            The task that was assigned:
            {objective}
    # @fgos:doc One collaboration pattern: its promise, loop, defaults and invariants.
    research-fan-out:
      # @fgos:doc One-sentence promise of what this pattern delivers. Default: Multiple researchers investigate a topic independently in parallel and a synthesizer produces the unified finding..
      promise: "Multiple researchers investigate a topic independently in parallel and a synthesizer produces the unified finding."
      # @fgos:doc The execution loop that runs this pattern. Values: solo | reviewed | panel | debate. Default: panel.
      loop: panel
      # @fgos:doc Default parameter values for the loop.
      defaults:
        # @fgos:doc Default seat declarations for the loop.
        seats:
          - seat: researcher-1
            role: producer
          - seat: researcher-2
            role: producer
          - seat: researcher-3
            role: producer
          - seat: synthesizer
            role: synthesizer
  # @fgos:doc Generated trees a unit write scope widens to when it touches their source. Default: [].
  generatedPaths: []
