# @fgos:v1
# see: fgos config standard
# @fgos:doc The runner: executors, capabilities, model policies, tier fallback, patterns and run limits.
runner:
  # @fgos:doc Settings of agent coordination.
  coordination:
    # @fgos:doc The organisation policy of coordination.
    orgPolicy:
      # @fgos:doc Outcomes that discharge an obligation. Default: ["accepted"].
      dischargeOn: [accepted]
  # @fgos:doc The executor registry: every executor a seat can be bound to, by id.
  executors:
    claude:
      kind: agent
      providerModel: claude
      description: "Claude Code CLI, the one executor of the claude family: claude-cli and claude-cli-bwrap run headless, claude-herdr-bwrap runs a claude REPL in a herdr pane under the bwrap posture. bind() picks the pane invocation inside herdr and a cli one outside, so a capability gets claude in both places."
      identity:
        principalRef: "principal://claude"
        runtimeBackendRef: "backend://claude-cli"
        trustDomain: local-operator
        egressClass: unrestricted
      supports:
        providerFamilies: [claude]
        reasoningEffort: [low, medium, high]
        skills: ["ak:cook"]
        systemPrompt: false
        toolGating: allowedTools
      invocations:
        - id: claude-cli
          via: cli
          adapter: cli-spawn
          command: claude
          args: ["-p", "{prompt}", "--model", "{model}", "--permission-mode", acceptEdits]
        - id: claude-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: claude
          args: ["-p", "{prompt}", "--model", "{model}"]
          confinement:
            backend: bwrap
        - id: claude-herdr-bwrap
          via: cli
          adapter: herdr-spawn
          command: claude
          args: ["--model", "{model}"]
          confinement:
            backend: bwrap
          interactiveMode:
            exitCommand: "/exit"
            kind: claude
            trustStore:
              kind: claude-json
    glm:
      kind: agent
      description: "GLM 5.3 (z-ai/glm-5.3) through the pi CLI and OpenRouter, headless. Replaces the claude-CLI-through-gateway route."
      allowCrossProvider: true
      invocations:
        - id: pi-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: pi
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,find,ls"
            - "--mode"
            - json
            - "--approve"
            - "-p"
            - "{prompt}"
          confinement:
            backend: bwrap
      providerModel: z-ai
      supports:
        skills: ["ak:cook"]
    gitnexus:
      kind: tool
      description: "Code-graph blast radius"
      for: [impact-analysis]
      scanTarget: ".gitnexus"
      responsibility: Verification
      invocations:
        - via: mcp
          command: "mcp:gitnexus"
          tools:
            impact-analysis: mcp__gitnexus__impact
    herdr:
      kind: tool
      for: [pane-labeling]
      responsibility: Chrome
      description: "herdr pane label writer (herdr pane rename) for /fgOS:terminal"
      invocations:
        - via: cli
          command: herdr
          args: []
    openai:
      kind: agent
      description: "OpenAI provider, 2 bins merged into one executor (2026-09-17 provider-naming pass): codex CLI (native OpenAI Codex CLI) + pi CLI (multi-provider agent, --provider omitted -- each ~/.pi/accounts/<name> dir carries exactly one provider's credentials, confirmed via real invocation test). Invocation id = <bin>-<mode>-<account>, self-descriptive regardless of which bin actually runs. Both bins now use modelPolicies like every other executor."
      providerModel: openai
      allowCrossProvider: true
      invocations:
        - id: codex-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: codex
          args:
            - exec
            - "--skip-git-repo-check"
            - "-s"
            - danger-full-access
            - "--model"
            - "{model}"
            - "{prompt}"
          confinement:
            backend: bwrap
        - id: pi-herdr
          via: cli
          adapter: herdr-spawn
          confinement:
            backend: bwrap
          command: pi
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,find,ls"
            - "--approve"
          interactiveMode:
            exitCommand: "/quit"
            kind: pi
        - id: codex-herdr
          via: cli
          adapter: herdr-spawn
          confinement:
            backend: bwrap
          command: codex
          args:
            - "-s"
            - danger-full-access
            - "-a"
            - never
            - "--no-daemon"
            - "--model"
            - "{model}"
          interactiveMode:
            exitCommand: "/quit"
            kind: codex
            trustStore:
              kind: codex-toml
        - id: pi-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: pi
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,find,ls"
            - "--mode"
            - json
            - "--approve"
            - "-p"
            - "{prompt}"
          confinement:
            backend: bwrap
      supports:
        skills: ["ak:cook"]
    gemini:
      kind: agent
      description: "Gemini provider via omp (oh-my-pi); Antigravity CLI (agy) invocations removed 2026-10-16 (agy not installed, owner chose omp). Invocations: omp-herdr (herdr pane), omp-cli-bwrap (headless). The confined account comes from runner.providers.gemini.accounts in the global config."
      allowCrossProvider: true
      providerModel: gemini
      invocations:
        - id: omp-herdr
          via: cli
          adapter: herdr-spawn
          confinement:
            backend: bwrap
          command: omp
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,glob"
            - "--auto-approve"
          interactiveMode:
            exitCommand: "/exit"
            kind: omp
        - id: omp-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: omp
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,glob"
            - "--mode"
            - json
            - "--auto-approve"
            - "-p"
            - "{prompt}"
          confinement:
            backend: bwrap
      supports:
        skills: ["ak:cook"]
    xai:
      kind: agent
      description: "xai (Grok) provider via omp CLI (oh-my-pi, a pi fork); replaces the pi grok login that kept needing re-OAuth. omp reads its login through PI_CODING_AGENT_DIR like pi does. omp uses glob instead of ls/find. The account files are declared in the global config (providers.xai)."
      allowCrossProvider: true
      providerModel: xai
      invocations:
        - id: omp-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: omp
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,glob"
            - "--mode"
            - json
            - "--auto-approve"
            - "-p"
            - "{prompt}"
          confinement:
            backend: bwrap
        - id: omp-herdr
          via: cli
          adapter: herdr-spawn
          confinement:
            backend: bwrap
          command: omp
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,glob"
            - "--auto-approve"
          interactiveMode:
            exitCommand: "/exit"
            kind: omp
      supports:
        skills: ["ak:cook"]
    deepseek:
      kind: agent
      description: "DeepSeek provider via pi CLI, OpenRouter gateway account. --provider omitted -- account dir has a single provider (openrouter). Same account dir also serves other OpenRouter-hosted models (e.g. glm-cli's z-ai route uses a different account/mechanism); --model alone selects deepseek/* here. pi-herdr-openrouter runs the same pi account in a confined herdr pane."
      allowCrossProvider: true
      providerModel: deepseek
      invocations:
        - id: pi-cli-bwrap
          via: cli
          adapter: cli-spawn
          command: pi
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,find,ls"
            - "--mode"
            - json
            - "--approve"
            - "-p"
            - "{prompt}"
          confinement:
            backend: bwrap
        - id: pi-herdr
          via: cli
          adapter: herdr-spawn
          confinement:
            backend: bwrap
          command: pi
          args:
            - "--model"
            - "{model}"
            - "--thinking"
            - medium
            - "--tools"
            - "read,write,edit,bash,grep,find,ls"
            - "--approve"
          interactiveMode:
            exitCommand: "/quit"
            kind: pi
      supports:
        skills: ["ak:cook"]
  # @fgos:doc The capability catalog: what each capability is called, which executors serve it and how it is held.
  capabilities:
    impact-analysis:
      description: "Code-graph blast radius"
      aliases: [impact_analysis, "Impact Analysis"]
      prefer: gitnexus
    pane-labeling:
      description: "Write a session/task id onto the current terminal pane's label, for a human watching a screen"
    advise:
      description: "Async product-decision consult -- value comes from disagreement and never changes project state."
      prefer:
        - executor: claude
          invocation: claude-cli-bwrap
      confinement:
        mode: required
        policy: host-write-denied
      serves:
        outputKind: decision
        mutates: false
    execute:
      description: "Compliance-driven work -- value comes from following the plan, changes files, and must pass verification."
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
      serves:
        outputKind: change
        mutates: true
      tier: advanced
    review:
      description: "Independent read-only review of a non-code artifact (docs, design, spec, config) before merge/decision -- distinct from code:review (I19, core/skills/_shared/capability-catalog.md)."
      confinement:
        mode: required
        policy: host-write-denied
      serves:
        outputKind: finding
        mutates: false
    fgos-coding-implement:
      description: "code-implement work for the coding domain executing stage -- preferred executor gemini through omp, claude as fallback."
      prefer:
        - executor: gemini
          invocation: omp-herdr
        - executor: deepseek
        - executor: glm
        - claude
      tier: advanced
    "code:implement":
      description: "Canonical coding implementation capability -- compliance-driven coding execution before implementation (D1/D2, docs/history/capability-aware-dispatch-activation/CONTEXT.md)"
      prefer:
        - executor: gemini
          invocation: omp-herdr
        - executor: deepseek
        - executor: glm
        - claude
      serves:
        outputKind: change
        domain: code
        mutates: true
    "code:review":
      description: "Canonical coding review capability -- independent read-only review of a coding implementation unit before merge (P2-runtime, docs/history/agent-coordination-foundation/plan.md)."
      prefer:
        - executor: openai
          invocation: codex-cli-bwrap
        - executor: claude
          invocation: claude-cli-bwrap
      confinement:
        mode: required
        policy: host-write-denied
      serves:
        outputKind: finding
        domain: code
        mutates: false
    "code:test":
      description: "Canonical coding test capability -- author or run tests for a coding implementation unit (P2-runtime, docs/history/agent-coordination-foundation/plan.md)."
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
      serves:
        outputKind: verification
        domain: code
    "code:debug":
      description: "Canonical coding debug capability -- read-only root-cause investigation of a coding defect (P2-runtime, docs/history/agent-coordination-foundation/plan.md)."
      prefer:
        - executor: openai
          invocation: codex-cli-bwrap
        - executor: claude
          invocation: claude-cli-bwrap
      confinement:
        mode: required
        policy: host-write-denied
      serves:
        outputKind: finding
        domain: code
    "code:refactor":
      description: "Canonical coding refactor capability -- behavior-preserving structural change to existing code (P2-runtime, docs/history/agent-coordination-foundation/plan.md)."
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
      serves:
