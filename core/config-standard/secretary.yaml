# @fgos:v1
# see: fgos config standard
# @fgos:doc The secretary head (Miu) and the ceilings of the units she runs herself through the request socket.
secretary:
  run:
    # @fgos:doc Longest wall-clock time one unit the secretary runs herself may take. In minutes. Minimum: 1. Maximum: 240. Default: 15.
    maxMinutes: 15
    # @fgos:doc Model tier of a unit the secretary runs herself. Values: nano | mini | standard | advanced | flagship | frontier. Default: standard.
    tier: standard
