# @fgos:v1
# see: fgos config standard
# @fgos:doc The size of this machine's worker seat pool.
workerSlots:
  # @fgos:doc Worker seats on this machine (a lead and a nested dispatch take none). Minimum: 1. Default: 4.
  ceiling: 4
  # @fgos:doc How long a top-level worker seat waits for a free lane before it fails with lane-pool-full. In seconds. Minimum: 0. Default: 900.
  laneWaitSec: 900
