# @fgos:v1
# see: fgos config standard
# @fgos:doc The fgOS gateway: its port, bind address and Cloudflare Access settings.
gateway:
  # @fgos:doc TCP port the gateway listens on. Minimum: 0. Maximum: 65535. Default: 4170.
  port: 4170
  # @fgos:doc IP address the gateway binds; loopback keeps it on this machine, so set 0.0.0.0 (or a LAN or Tailscale address) to reach it from other machines. Default: 127.0.0.1.
  bind: 127.0.0.1
