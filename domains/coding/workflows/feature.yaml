# domains/coding/workflows/feature.yaml — Feature implementation workflow for coding domain (dual-schema for P3b migration)

id: coding/feature
title: Feature implementation workflow for coding domain

# --- New Workflow Schema (P3a / P3b) ---
steps:
  - id: discovery
    title: Discovery
    units:
      - id: judge-ambiguity
        template:
          capability: coding:discover
          pattern: solo
          taskSpec: judge-ambiguity
  - id: exploring
    title: Exploring
    dependsOn: [discovery]
    units:
      - id: lock-decisions
        template:
          capability: coding:explore
          pattern: solo
          taskSpec: lock-decisions
    gate:
      kind: human
      question: Lock decisions for this item?
  - id: planning
    title: Planning
    dependsOn: [exploring]
    units:
      - id: shape-plan
        template:
          capability: coding:plan
          pattern: solo
          taskSpec: shape-plan
      - id: validate-plan
        template:
          capability: coding:validate
          pattern: reviewed
          taskSpec: validate-plan
  - id: executing
    title: Executing
    dependsOn: [planning]
    units:
      - id: implement-item
        template:
          capability: coding:implement
          pattern: reviewed
          taskSpec: implement-item
  - id: integrate
    kind: integrate
    dependsOn: [executing]
  - id: approval
    dependsOn: [integrate]
    gate:
      kind: human
      question: Approve delivery of this item?

# --- Legacy Stage Schema (compatibility for stage-aware readers during P3b) ---
stages:
  - name: discovery
    skill: fgos-coding-discovering
    taskSpec: judge-ambiguity
    operations:
      - id: judge-ambiguity
        primary: true
        taskSpec: judge-ambiguity
        role: implementer
        skills:
          - fgos-coding-discovering
      - id: resolve-question
        taskSpec: resolve-question
        role: researcher
        reason: consult
        skills:
          - fgos-researching
  - name: exploring
    skill: fgos-coding-exploring
    taskSpec: lock-decisions
    operations:
      - id: lock-decisions
        primary: true
        taskSpec: lock-decisions
        role: implementer
        skills:
          - fgos-coding-exploring
      - id: answer-question
        taskSpec: answer-question
        role: advisor
        reason: advise
        dispatch: human-only
        skills:
          - fgos-coding-exploring
      - id: resolve-question
        taskSpec: resolve-question
        role: researcher
        reason: consult
        skills:
          - fgos-researching
  - name: decompose
    skill: fgos-coding-planning
  - name: planning
    step: Divide
    skill: fgos-coding-planning
    taskSpec: shape-plan
    operations:
      - id: shape-plan
        primary: true
        taskSpec: shape-plan
        role: implementer
        skills:
          - fgos-coding-planning
      - id: validate-plan
        taskSpec: validate-plan
        role: reviewer
        reason: review
        skills:
          - fgos-coding-validating
        policy:
          rigor: standard
      - id: scout-blast-radius
        taskSpec: scout-blast-radius
        role: researcher
        reason: consult
        skills:
          - fgos-researching
      - id: resolve-question
        taskSpec: resolve-question
        role: researcher
        reason: consult
        skills:
          - fgos-researching
  - name: executing
    step: Execute
    skill: fgos-coding-implement
    taskSpec: implement-item
    operations:
      - id: implement-item
        primary: true
        taskSpec: implement-item
        role: implementer
        skills:
          - fgos-coding-implement
      - id: review-item
        taskSpec: review-item
        role: reviewer
        reason: review
        skills:
          - fgos-coding-validating
      - id: fix-verify-red
        taskSpec: fix-verify-red
        role: implementer
        skills:
          - fgos-coding-implement
      - id: scoped-subtask
        taskSpec: scoped-subtask
        role: helper
        reason: assist
        skills:
          - fgos-coding-implement
      - id: scout-blast-radius
        taskSpec: scout-blast-radius
        role: researcher
        reason: consult
        skills:
          - fgos-researching
      - id: resolve-question
        taskSpec: resolve-question
        role: researcher
        reason: consult
        skills:
          - fgos-researching

transitions:
  - from: clarify
    to: discovery
  - from: clarify
    to: exploring
  - from: decompose
    to: executing
  - from: exploring
    to: decompose
  - from: discovery
    to: exploring
  - from: discovery
    to: planning
  - from: exploring
    to: planning
  - from: planning
    to: executing

statusSkills:
  retrospective:
    skill: fgos-coding-knowledge
    taskSpec: compound-learn
