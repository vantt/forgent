<!DOCTYPE html>

<style>
      body {
        background-color: #f9fafb; /* Level 0 Floor */
      }
      .card-shadow {
        box-shadow: 0px 1px 3px rgba(0,0,0,0.05), 0px 10px 15px -3px rgba(0,0,0,0.03);
      }
      .input-glow:focus-within {
        border-color: #630ed4;
        box-shadow: 0 0 0 3px rgba(99, 14, 212, 0.15);
      }
    </style>

<body class="min-h-screen flex flex-col items-center justify-center font-body-md text-on-surface">
<!-- Main Container -->
<main class="w-full max-w-[400px] px-margin-mobile md:px-0 flex flex-col items-center z-10">
<!-- Brand Header -->
<div class="mb-xl text-center w-full">
<h1 class="font-display text-display text-primary tracking-tight">herdr</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">fgOS work dashboard</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg md:p-margin-desktop w-full card-shadow border border-[#f3f4f6]">
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault(); document.getElementById('error-message').classList.remove('hidden');">
<!-- Input Field Group -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="access-token">Access token</label>
<div class="relative input-glow rounded transition-shadow duration-200">
<input class="w-full h-[48px] px-md border border-[#e5e7eb] rounded outline-none font-body-lg text-body-lg bg-surface-container-lowest text-on-surface placeholder:text-outline-variant focus:border-transparent focus:ring-0" id="access-token" name="access-token" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary rounded-lg font-title-lg text-title-lg transition-all duration-200 hover:opacity-90 hover:shadow-md flex items-center justify-center gap-sm mt-sm" type="submit">
                    Sign in
                </button>
<!-- Hidden Error State -->
<div class="hidden text-center transition-opacity duration-300" id="error-message">
<p class="font-label-md text-label-md text-error flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">error</span>
                        Sign-in failed. Please check your token.
                    </p>
</div>
</form>
</div>
</main>
<!-- Contextual Footer (Transactional Page - no global nav) -->
<footer class="fixed bottom-0 w-full flex flex-col items-center pb-lg px-margin-mobile">
<p class="font-label-sm text-label-sm text-outline tracking-wider uppercase opacity-60">Reachable beyond this machine.</p>
</footer>
</body></html>
