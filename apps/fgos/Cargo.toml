[package]
name = "fgos"
version.workspace = true
edition.workspace = true

[dependencies]
fgos-host-runtime = { path = "../../packages/host-runtime/rust" }
fgos-distribution = { path = "../../packages/distribution/rust" }
fgos-work-state = { path = "../../packages/work-state/rust" }
fgos-observe = { path = "../../packages/observe/rust" }
fgos-convention = { path = "../../packages/convention/rust" }
fgos-session-identity = { path = "../../packages/session-identity/rust" }
fgos-run-result = { path = "../../packages/run-result/rust" }
fgos-holder-lock = { path = "../../packages/holder-lock/rust" }
fgos-run-supervisor = { path = "../../packages/run-supervisor/rust" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "arbitrary_precision"] }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
fgos-process = { path = "../../packages/process/rust" }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }
