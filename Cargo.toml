[workspace]
members = [
    "packages/git/write-scope",
    "packages/git/node-addon",
    "packages/canonical-json/rust",
    "packages/event-store/rust",
    "packages/durable-file/rust",
    "apps/fgos",
    "apps/fgctl",
    "packages/host-runtime/rust",
    "packages/distribution/rust",
    "packages/work-state/rust",
    "packages/observe/rust",
    "packages/convention/rust",
    "packages/run-result/rust",
    "packages/herdr-fgos-common/rust",
    "packages/identity/rust",
    "packages/process/rust",
    "packages/holder-lock/rust",
    "packages/run-supervisor/rust",
    "packages/agent-protocol/rust",
    "packages/terminal-control/rust",
    "packages/git/rust",
    "packages/durable-file/rust",
    "packages/secrets/rust",
    "packages/mailbox/rust/core",
    "packages/mailbox/rust/store",
    "packages/seat-binding/rust",
    "packages/yaml-doc/rust",
    "packages/config/rust",
]
exclude = [
    "herdr-dashboard",
    "apps/fgos-gateway",
    "upstreams",
    # Vendored third-party crates (upgrade record: packages/yaml-doc/upgrade-record.md). Path crates
    # under the workspace directory would otherwise become members and be swept into --workspace runs.
    "packages/yaml-doc/third-party",
]
resolver = "2"

# The native addon is read and hashed whole by every Node process that loads it, so its size is a start-up
# cost: strip the symbol tables from release builds (21.6 MB to 16.4 MB for the addon).
[profile.release]
strip = "symbols"

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
# The JSON Schema validator under fgos-config: pinned exactly, no optional features (no I/O, no network
# retriever). Upgrade record and acceptance tests: packages/config/upgrade-record.md.
jsonschema = { version = "=0.60.0", default-features = false }
libc = "=0.2.189"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
] }

# The YAML parser and its one transitive crate, read and vendored (spec docs/platform/yaml-document/spec.md
# section 9). The committed bytes are pinned by tests/third_party_integrity.rs in fgos-yaml-doc.
[patch.crates-io]
saphyr-parser = { path = "packages/yaml-doc/third-party/saphyr-parser-0.2.2" }
arraydeque = { path = "packages/yaml-doc/third-party/arraydeque-0.5.1" }
