[workspace]
members = [
    "packages/git/write-scope",
    "packages/git/node-addon",
    "packages/canonical-json/rust",
    "packages/event-store/rust",
    "packages/durable-file/rust",
    "apps/fgos",
    "apps/fgctl",
    "packages/host-runtime/rust",
    "packages/distribution/rust",
    "packages/work-state/rust",
    "packages/observe/rust",
    "packages/convention/rust",
    "packages/run-result/rust",
    "packages/herdr-fgos-common/rust",
    "packages/session-identity/rust",
    "packages/process/rust",
    "packages/holder-lock/rust",
    "packages/run-supervisor/rust",
    "packages/agent-protocol/rust",
    "packages/terminal-control/rust",
    "packages/git/rust",
    "packages/durable-file/rust",
]
exclude = [
    "herdr-dashboard",
    "apps/fgos-gateway",
    "upstreams",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
libc = "=0.2.189"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
] }
