[workspace]
members = [
    "apps/fgos",
    "apps/fgctl",
    "packages/host-runtime/rust",
    "packages/distribution/rust",
    "packages/work-state/rust",
    "packages/observe/rust",
    "packages/run-result/rust",
    "packages/herdr-fgos-common/rust",
]
exclude = [
    "herdr-dashboard",
    "apps/fgos-gateway",
    "upstreams",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
