# Audit the locked dependency graph, including the combined addon toolchain.
[advisories]
# Pre-existing serde_yaml dependency of host-runtime and observe; replacement tracked on the program board, 2026-10-18.
ignore = ["RUSTSEC-2024-0449"]

[bans]
multiple-versions = "warn"
# Existing workspace path dependencies omit publish=false; --locked pins the external graph.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
