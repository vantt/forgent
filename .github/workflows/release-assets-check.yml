name: Release assets check

# Builds and proves the release assets exactly as release.yml would, on every target,
# without publishing anything. Publishing lives only in release.yml, under the tag trigger.

on:
  push:
    branches: [feat/windows-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    uses: ./.github/workflows/release-assets.yml

  # The tests that cover the Windows-specific code paths (install.ps1, the cmd launchers, the
  # release target table, the Windows release tree), run natively on both operating systems.
  focused-tests:
    name: focused tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The convention check reads history, so a shallow clone would skip it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: cargo test (distribution crate)
        run: cargo test -p fgos-distribution

      - name: Node tests for installers, launchers and release packaging
        run: >
          node --test
          test/install/install-ps1.test.mjs
          test/install/install-sh.test.mjs
          test/rust-host/fgctl-init.test.mjs
          test/rust-host/fgctl-upgrade.test.mjs
          test/rust-host/release-targets.test.mjs
          test/rust-host/release-tree.test.mjs
          test/scripts/release-packaging.test.mjs
          test/setup/curl-check.test.mjs
