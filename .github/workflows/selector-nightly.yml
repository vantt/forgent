name: selector-nightly
on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC daily
  workflow_dispatch:

jobs:
  nightly-mutate:
    name: Nightly Fault Injection and Coverage
    runs-on: ubuntu-latest
    # Backstop only: the coverage step bounds every test file itself, so this
    # just stops a job-level stall from holding a runner for GitHub's 6h default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same test environment as ci.yml's `test` job: coverage and the
      # mutation full-suite runs are only meaningful against the suite CI
      # actually runs (zsh-based, git-committing and rust-host tests fail
      # for environmental reasons otherwise).
      - name: Install Linux test tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap zsh

      - name: Configure git identity for fixture repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install

      - name: Build Rust release binaries for npm tests
        run: cargo build --release --workspace

      - name: Run coverage map generator
        run: node scripts/test-select-coverage-map.mjs
        env:
          FORCE_COLOR: 1

      - name: Run mutation tests
        run: node scripts/test-select-mutate.mjs
        env:
          FORCE_COLOR: 1

      - name: Upload ledger and coverage map
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ledger
          path: |
            nightly-ledger.json
            plans/260922-test-suite-optimization/reports/coverage-map-*.json
            plans/260922-test-suite-optimization/reports/coverage-suggestion-*.md
          retention-days: 30
