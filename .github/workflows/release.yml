name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check-version:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${TAG_VERSION%%-*}"
          PKG_VERSION="$(node -pe "require('./package.json').version")"
          if [ "$BASE_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag base $BASE_VERSION does not match package.json $PKG_VERSION" >&2
            exit 1
          fi

  assets:
    name: assets
    needs: check-version
    uses: ./.github/workflows/release-assets.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    name: publish
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-target assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: parts

      - name: Assemble release assets
        run: |
          set -eu
          mkdir -p dist
          cp parts/*/fgos-*.tar.gz parts/*/fgctl-*.tar.gz dist/

          # Every target ships the same installers; refuse a release where they differ.
          for installer in install.sh install.ps1; do
            first=""
            for part in parts/*/; do
              if [ -z "$first" ]; then
                first="$part$installer"
                cp "$first" "dist/$installer"
              elif ! cmp -s "$first" "$part$installer"; then
                echo "Error: $installer differs between ${first%/*} and ${part%/}" >&2
                exit 1
              fi
            done
          done

          # One SHA256SUMS covering every asset, checked against the bytes about to be published.
          cat parts/*/SHA256SUMS | sort -k2 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          for asset in dist/fgos-*.tar.gz dist/fgctl-*.tar.gz; do
            grep -q "  $(basename "$asset")\$" dist/SHA256SUMS || {
              echo "Error: SHA256SUMS has no entry for $(basename "$asset")" >&2
              exit 1
            }
          done
          for triple in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            for kind in fgos fgctl; do
              ls dist/"$kind"-*-"$triple".tar.gz > /dev/null
            done
          done
          ls -l dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          PRERELEASE_FLAG=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            $PRERELEASE_FLAG \
            dist/fgos-*.tar.gz \
            dist/fgctl-*.tar.gz \
            dist/SHA256SUMS \
            dist/install.sh \
            dist/install.ps1
