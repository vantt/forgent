name: process-containment

# Runs on pushes to run-supervisor, terminal-mode and controller-death branches and on demand: runs the process-containment driver tests on real Windows,
# macOS and Linux runners (Job Objects, process groups, pid namespaces).
on:
  push:
    branches: ['main', 'run-supervisor/**', 'terminal-mode/**', 'controller-death/**']
    paths:
      - 'packages/process/**'
      - 'packages/run-supervisor/**'
      - 'packages/holder-lock/**'
      - 'packages/agent-protocol/**'
      - 'Cargo.lock'
      - '.github/workflows/process-containment.yml'
  pull_request:
    paths:
      - 'packages/process/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap zsh
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / -- true && echo "bwrap can build a sandbox"
      - name: Test containment drivers
        shell: bash
        run: cargo test -p fgos-process -p fgos-run-supervisor -p fgos-agent-protocol
