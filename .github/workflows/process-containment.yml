name: process-containment

# Manual only: runs the process-containment driver tests on real Windows,
# macOS and Linux runners (Job Objects, process groups, pid namespaces).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test containment drivers
        shell: bash
        run: cargo test -p fgos-process -p fgos-run-supervisor
