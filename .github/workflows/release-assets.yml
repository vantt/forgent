name: Release assets

# Builds, packages and proves the release assets for every published target.
# It publishes nothing: release.yml (tag trigger) calls it and owns publishing;
# release-assets-check.yml and ci.yml call it to prove the same assets without one.
#
# Adding a platform is one matrix row here, one row in src/util/release-targets.mjs and
# in the Rust host_target table, and an installer for it.

on:
  workflow_call:
    inputs:
      version:
        description: Release tag the assets are named for (for example v0.2.0-rc.2). Empty means v<package.json version>-assets-check.
        type: string
        default: ""
      artifact-prefix:
        description: >-
          Prefix of every artifact this workflow uploads. A run that calls this workflow twice (the
          release: its own assets and the suite's reproducibility proof) gives each call its own
          prefix, so publish can never download the other call's assets.
        type: string
        default: release

permissions:
  contents: read

env:
  MSVC_TOOLSET_VERSION: '14.52'
  WINDOWS_SDK_VERSION: '10.0.26100.0'

jobs:
  dependency-audit:
    name: audit locked dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --config .github/cargo-deny.toml check advisories bans sources

  build:
    name: assets (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Linux image: a binary links against the glibc of
          # the machine that built it, and the default image is newer than the distros fgOS runs on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve asset version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="v$(node -pe "require('./package.json').version")-assets-check"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging assets as $VERSION for ${{ matrix.target }}"

      - name: Pin Windows MSVC toolset and Windows SDK
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          VSWHERE="vswhere.exe"
          if ! command -v "$VSWHERE" >/dev/null 2>&1; then
            for p in "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" "C:/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"; do
              if [ -f "$p" ]; then VSWHERE="$p"; break; fi
            done
          fi
          VS_INSTALL=$("$VSWHERE" -latest -property installationPath | tr -d '\r')
          if [ -z "$VS_INSTALL" ]; then
            echo "::error::Visual Studio installation not found via vswhere"
            exit 1
          fi
          VS_DIR="${VS_INSTALL//\\//}"
          MSVC_DIR="$VS_DIR/VC/Tools/MSVC"
          SDK_LIB_DIR="C:/Program Files (x86)/Windows Kits/10/Lib"
          if [ ! -d "$SDK_LIB_DIR" ]; then
            SDK_LIB_DIR="C:/Program Files/Windows Kits/10/Lib"
          fi

          echo "Installed MSVC toolsets in $MSVC_DIR:"
          ls -1 "$MSVC_DIR" 2>/dev/null || true
          echo "Installed Windows SDKs in $SDK_LIB_DIR:"
          ls -1 "$SDK_LIB_DIR" 2>/dev/null || true

          if ! ls -1 "$MSVC_DIR" 2>/dev/null | grep -E "^${MSVC_TOOLSET_VERSION}(\.|$)" >/dev/null; then
            echo "::error::Pinned MSVC toolset '$MSVC_TOOLSET_VERSION' is missing. Installed toolsets: $(ls -m "$MSVC_DIR" 2>/dev/null)"
            exit 1
          fi
          if ! ls -1 "$SDK_LIB_DIR" 2>/dev/null | grep -E "^${WINDOWS_SDK_VERSION}(\.|$)" >/dev/null; then
            echo "::error::Pinned Windows SDK '$WINDOWS_SDK_VERSION' is missing. Installed SDKs: $(ls -m "$SDK_LIB_DIR" 2>/dev/null)"
            exit 1
          fi

          VCVARSALL="${VS_INSTALL}\\VC\\Auxiliary\\Build\\vcvarsall.bat"
          ENV_OUT=$(mktemp)
          if ! MSYS2_ARG_CONV_EXCL="*" cmd.exe /c "call \"$VCVARSALL\" x64 $WINDOWS_SDK_VERSION -vcvars_ver=$MSVC_TOOLSET_VERSION && set || exit /b 1" > "$ENV_OUT" 2>&1; then
            echo "::error::vcvarsall.bat failed to initialize environment"
            cat "$ENV_OUT"
            exit 1
          fi

          TARGET_VARS=(PATH LIB LIBPATH INCLUDE VCINSTALLDIR VCToolsInstallDir VCToolsVersion WindowsSdkDir WindowsSDKVersion UCRTVersion VSCMD_ARG_TGT_ARCH)
          for var in "${TARGET_VARS[@]}"; do
            val=$(grep -m 1 -E "^${var}=" "$ENV_OUT" | cut -d= -f2- | tr -d '\r')
            if [ -n "$val" ]; then
              echo "$var=$val" >> "$GITHUB_ENV"
              export "$var=$val"
            fi
          done

          echo "Selected link.exe version:"
          LINK_EXE="${VCToolsInstallDir//\\//}/bin/Hostx64/x64/link.exe"
          if [ -f "$LINK_EXE" ]; then
            ("$LINK_EXE" /? 2>&1 || true) | sed -n '1,2p'
          else
            (link.exe /? 2>&1 || true) | sed -n '1,2p'
          fi

      - name: Deterministic Windows linker
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C link-arg=/Brepro' >> "$GITHUB_ENV"

      - name: Build workspace (release)
        run: cargo build --locked --release --workspace

      - name: Check glibc ceiling of the shipped binaries
        if: runner.os == 'Linux'
        run: scripts/check-glibc-ceiling.sh target/release/fgos target/release/fgctl

      - name: Package release assets
        run: node scripts/package-release-assets.mjs --version "${{ steps.version.outputs.version }}" --out dist

      - name: Record staged addon digest and verify manifest binding
        run: node --input-type=module -e "import fs from 'node:fs'; import {hashFile} from './scripts/build-rust-distribution.mjs'; const m=JSON.parse(fs.readFileSync('dist/tree/manifest.json')); const a=m.components.nativeAddon; const digest=hashFile('dist/tree/'+a.path); if(digest!=='sha256:'+a.digest || !m.files.some(f=>f.path===a.path && f.digest===digest)) throw Error('staged addon manifest mismatch'); fs.writeFileSync('addon-digest.txt',digest+'\n');"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-shipped-addon-${{ matrix.target }}
          path: addon-digest.txt
          if-no-files-found: error

      - name: Resolve staged addon path
        if: matrix.target == 'x86_64-pc-windows-msvc'
        id: staged-addon
        run: |
          echo "path=$(node -pe "const m=JSON.parse(require('fs').readFileSync('dist/tree/manifest.json')); 'dist/tree/' + m.components.nativeAddon.path")" >> "$GITHUB_OUTPUT"

      - name: Upload windows-msvc staged addon file
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-shipped-addon-file-${{ matrix.target }}
          path: ${{ steps.staged-addon.outputs.path }}
          if-no-files-found: error
          retention-days: 3

      # The proof runs `fgos doctor` on a clean runner, so the runner is set up the way
      # docs/how-to/install-fgos-in-a-project-and-use-doctor.md section 4.4.1 tells a Linux user.
      - name: Set up bubblewrap like a supported Linux machine
        if: runner.os == 'Linux'
        run: scripts/ci-setup-bwrap.sh

      - name: External consumer proof (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-external-consumer.sh --assets dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: External consumer proof (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/ci-external-consumer.ps1 -Assets dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: External consumer proof (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-external-consumer.ps1 -Assets dist
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-assets-${{ matrix.target }}
          path: |
            dist/fgos-*.tar.gz
            dist/fgctl-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  independent-addon:
    name: independent addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pin Windows MSVC toolset and Windows SDK
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          VSWHERE="vswhere.exe"
          if ! command -v "$VSWHERE" >/dev/null 2>&1; then
            for p in "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" "C:/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"; do
              if [ -f "$p" ]; then VSWHERE="$p"; break; fi
            done
          fi
          VS_INSTALL=$("$VSWHERE" -latest -property installationPath | tr -d '\r')
          if [ -z "$VS_INSTALL" ]; then
            echo "::error::Visual Studio installation not found via vswhere"
            exit 1
          fi
          VS_DIR="${VS_INSTALL//\\//}"
          MSVC_DIR="$VS_DIR/VC/Tools/MSVC"
          SDK_LIB_DIR="C:/Program Files (x86)/Windows Kits/10/Lib"
          if [ ! -d "$SDK_LIB_DIR" ]; then
            SDK_LIB_DIR="C:/Program Files/Windows Kits/10/Lib"
          fi

          echo "Installed MSVC toolsets in $MSVC_DIR:"
          ls -1 "$MSVC_DIR" 2>/dev/null || true
          echo "Installed Windows SDKs in $SDK_LIB_DIR:"
          ls -1 "$SDK_LIB_DIR" 2>/dev/null || true

          if ! ls -1 "$MSVC_DIR" 2>/dev/null | grep -E "^${MSVC_TOOLSET_VERSION}(\.|$)" >/dev/null; then
            echo "::error::Pinned MSVC toolset '$MSVC_TOOLSET_VERSION' is missing. Installed toolsets: $(ls -m "$MSVC_DIR" 2>/dev/null)"
            exit 1
          fi
          if ! ls -1 "$SDK_LIB_DIR" 2>/dev/null | grep -E "^${WINDOWS_SDK_VERSION}(\.|$)" >/dev/null; then
            echo "::error::Pinned Windows SDK '$WINDOWS_SDK_VERSION' is missing. Installed SDKs: $(ls -m "$SDK_LIB_DIR" 2>/dev/null)"
            exit 1
          fi

          VCVARSALL="${VS_INSTALL}\\VC\\Auxiliary\\Build\\vcvarsall.bat"
          ENV_OUT=$(mktemp)
          if ! MSYS2_ARG_CONV_EXCL="*" cmd.exe /c "call \"$VCVARSALL\" x64 $WINDOWS_SDK_VERSION -vcvars_ver=$MSVC_TOOLSET_VERSION && set || exit /b 1" > "$ENV_OUT" 2>&1; then
            echo "::error::vcvarsall.bat failed to initialize environment"
            cat "$ENV_OUT"
            exit 1
          fi

          TARGET_VARS=(PATH LIB LIBPATH INCLUDE VCINSTALLDIR VCToolsInstallDir VCToolsVersion WindowsSdkDir WindowsSDKVersion UCRTVersion VSCMD_ARG_TGT_ARCH)
          for var in "${TARGET_VARS[@]}"; do
            val=$(grep -m 1 -E "^${var}=" "$ENV_OUT" | cut -d= -f2- | tr -d '\r')
            if [ -n "$val" ]; then
              echo "$var=$val" >> "$GITHUB_ENV"
              export "$var=$val"
            fi
          done

          echo "Selected link.exe version:"
          LINK_EXE="${VCToolsInstallDir//\\//}/bin/Hostx64/x64/link.exe"
          if [ -f "$LINK_EXE" ]; then
            ("$LINK_EXE" /? 2>&1 || true) | sed -n '1,2p'
          else
            (link.exe /? 2>&1 || true) | sed -n '1,2p'
          fi

      - name: Deterministic Windows linker
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C link-arg=/Brepro' >> "$GITHUB_ENV"
      # Same workspace feature graph, independent machine and Cargo outputs; no cache.
      - run: cargo build --locked --release --workspace
      - name: Record independent digest
        run: node --input-type=module -e "import fs from 'node:fs'; import {hashFile,nativeAddonLibraryName} from './scripts/build-rust-distribution.mjs'; fs.writeFileSync('addon-digest.txt',hashFile('target/release/'+nativeAddonLibraryName())+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-independent-addon-${{ matrix.target }}
          path: addon-digest.txt
          if-no-files-found: error

      - name: Upload windows-msvc independent addon file
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-independent-addon-file-${{ matrix.target }}
          path: target/release/fgos_node_addon.dll
          if-no-files-found: error
          retention-days: 3

  compare-addon:
    name: compare addon digests
    needs: [build, independent-addon]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact-prefix }}-*addon-*
          path: addon-digests
      - name: Compare both published targets
        shell: bash
        env:
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          set -eu
          for triple in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            shipped="addon-digests/$PREFIX-shipped-addon-$triple/addon-digest.txt"
            independent="addon-digests/$PREFIX-independent-addon-$triple/addon-digest.txt"
            if ! cmp "$shipped" "$independent"; then
              echo "::error::Addon digest mismatch for $triple"
              mismatch_dir="addon-mismatch-$triple"
              mkdir -p "$mismatch_dir"
              shipped_file=$(find "addon-digests/$PREFIX-shipped-addon-file-$triple" -type f 2>/dev/null | head -n 1 || true)
              independent_file=$(find "addon-digests/$PREFIX-independent-addon-file-$triple" -type f 2>/dev/null | head -n 1 || true)
              if [ -n "$shipped_file" ]; then
                cp "$shipped_file" "$mismatch_dir/shipped-$(basename "$shipped_file")"
              fi
              if [ -n "$independent_file" ]; then
                cp "$independent_file" "$mismatch_dir/independent-$(basename "$independent_file")"
              fi
              cmp "$shipped" "$independent"
            fi
          done
      - name: Upload addon mismatch evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-addon-mismatch-x86_64-pc-windows-msvc
          path: addon-mismatch-x86_64-pc-windows-msvc/
          if-no-files-found: ignore
          retention-days: 14
