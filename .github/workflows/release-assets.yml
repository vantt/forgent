name: Release assets

# Builds, packages and proves the release assets for every published target.
# It publishes nothing: release.yml (tag trigger) calls it and owns publishing;
# release-assets-check.yml and ci.yml call it to prove the same assets without one.
#
# Adding a platform is one matrix row here, one row in src/util/release-targets.mjs and
# in the Rust host_target table, and an installer for it.

on:
  workflow_call:
    inputs:
      version:
        description: Release tag the assets are named for (for example v0.2.0-rc.2). Empty means v<package.json version>-assets-check.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dependency-audit:
    name: audit locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --config .github/cargo-deny.toml check advisories bans sources

  build:
    name: assets (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Linux image: a binary links against the glibc of
          # the machine that built it, and the default image is newer than the distros fgOS runs on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show && cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve asset version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="v$(node -pe "require('./package.json').version")-assets-check"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging assets as $VERSION for ${{ matrix.target }}"

      - name: Deterministic Windows linker
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C link-arg=/Brepro' >> "$GITHUB_ENV"

      - name: Build workspace (release)
        run: cargo build --locked --release --workspace

      - name: Check glibc ceiling of the shipped binaries
        if: runner.os == 'Linux'
        run: scripts/check-glibc-ceiling.sh target/release/fgos target/release/fgctl

      - name: Record shipped addon digest
        run: node --input-type=module -e "import fs from 'node:fs'; import {hashFile,nativeAddonLibraryName} from './scripts/build-rust-distribution.mjs'; fs.writeFileSync('addon-digest.txt',hashFile('target/release/'+nativeAddonLibraryName())+'\n');"

      - uses: actions/upload-artifact@v4
        with:
          name: shipped-addon-${{ matrix.target }}
          path: addon-digest.txt
          if-no-files-found: error

      - name: Package release assets
        run: node scripts/package-release-assets.mjs --version "${{ steps.version.outputs.version }}" --out dist

      - name: External consumer proof (Linux)
        if: runner.os == 'Linux'
        run: scripts/ci-external-consumer.sh --assets dist

      - name: External consumer proof (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/ci-external-consumer.ps1 -Assets dist

      - name: External consumer proof (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-external-consumer.ps1 -Assets dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/fgos-*.tar.gz
            dist/fgctl-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  independent-addon:
    name: independent addon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deterministic Windows linker
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C link-arg=/Brepro' >> "$GITHUB_ENV"
      # Same workspace feature graph, independent machine and Cargo outputs; no cache.
      - run: cargo build --locked --release --workspace
      - name: Record independent digest
        run: node --input-type=module -e "import fs from 'node:fs'; import {hashFile,nativeAddonLibraryName} from './scripts/build-rust-distribution.mjs'; fs.writeFileSync('addon-digest.txt',hashFile('target/release/'+nativeAddonLibraryName())+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: independent-addon-${{ matrix.target }}
          path: addon-digest.txt
          if-no-files-found: error

  compare-addon:
    name: compare addon digests
    needs: [build, independent-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*addon-*'
          path: addon-digests
      - name: Compare both published targets
        shell: bash
        run: |
          set -eu
          for triple in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            cmp "addon-digests/shipped-addon-$triple/addon-digest.txt" "addon-digests/independent-addon-$triple/addon-digest.txt"
          done
