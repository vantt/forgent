[package]
name = "fgos-platform-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures the OS lock and process-containment mechanisms the fgOS lock/run-supervisor design relies on"

# Standalone package: not a member of the main workspace, so it drags none of
# the workspace dependencies and builds on any machine with a Rust toolchain.
[workspace]

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
