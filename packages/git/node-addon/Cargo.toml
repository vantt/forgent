[package]
name = "fgos-node-addon"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fgos-write-scope = { path = "../write-scope" }
napi = { version = "=2.16.17", default-features = false, features = ["napi8", "serde-json", "dyn-symbols", "compat-mode"] }
napi-derive = "=2.16.13"
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
fgos-git = { path = "../rust" }
fgos-event-store = { path = "../../event-store/rust" }
fgos-holder-lock = { path = "../../holder-lock/rust" }

[build-dependencies]
napi-build = "=2.2.4"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
