[package]
name = "fgos-agent-start-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Agent Start Context: the one composer of the text every fgOS-started agent receives (compose: facts, payloads, delivery -> ordered blocks or a named refusal). Pure: no I/O; the host wires the ports."

[dependencies]
# The reader of the compiled rule set and the when-keys registry only: without the store feature it links no pkm.
fgos-agent-context-engine = { path = "../../agent-context-engine/rust", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
