[package]
name = "fgos-run-supervisor"
version.workspace = true
edition.workspace = true

[dependencies]
fgos-durable-file = { path = "../../durable-file/rust" }
fgos-canonical-json = { path = "../../canonical-json/rust" }
fgos-process = { path = "../../process/rust" }
fgos-holder-lock = { path = "../../holder-lock/rust" }
fgos-agent-protocol = { path = "../../agent-protocol/rust" }
fgos-terminal-control = { path = "../../terminal-control/rust" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }
