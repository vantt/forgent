[package]
name = "fgos-run-supervisor"
version.workspace = true
edition.workspace = true

[dependencies]
fgos-process = { path = "../../process/rust" }
fgos-holder-lock = { path = "../../holder-lock/rust" }
fgos-agent-protocol = { path = "../../agent-protocol/rust" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Pipes"] }
