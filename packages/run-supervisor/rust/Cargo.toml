[package]
name = "fgos-run-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
fgos-durable-file = { path = "../../durable-file/rust" }
fgos-canonical-json = { path = "../../canonical-json/rust" }
fgos-process = { path = "../../process/rust" }
# The one random door the lease token draws from, and (with `supervise`) the ISO-8601 UTC clock and session
# directory a head session registers its role in; the library without its host provider.
fgos-identity = { path = "../../identity/rust", default-features = false }
fgos-holder-lock = { path = "../../holder-lock/rust" }
fgos-agent-protocol = { path = "../../agent-protocol/rust", optional = true }
fgos-terminal-control = { path = "../../terminal-control/rust", optional = true }
fgos-session-host = { path = "../../session-host/rust", optional = true }
# The effective `dispatch` config the controller reads (gate kill grace, cancel wait, lane settings).
fgos-config = { path = "../../config/rust", optional = true }
# The bounded parse of a head request frame (a visitor that counts values while it reads).
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[features]
# `lease` is the run control ledger alone (what the addon reads); `supervise` is every other module, the
# supervisor routes and the rest of the controller, and is on by default.
default = ["supervise"]
lease = []
supervise = ["lease", "fgos-identity/directory", "dep:fgos-agent-protocol", "dep:fgos-terminal-control", "dep:fgos-session-host", "dep:fgos-config"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

