job: make, provision and remove a checkout
kind: door
patterns:
  - \bfgos_checkout\b
  - \.create_worktree\(
  - \.remove_worktree\(
  - \.prune_worktree\(
  - (?<!function )\bcreateGitWorktree\(
  - (?<!function )\bcreateWorktreeCheckoutSync\(
  - \bworktreeSetup\b
allowed:
  - packages/execution/checkout/**
  - apps/fgos/src/wiring/worktree.rs
  - packages/git/node-addon/src/checkout.rs
  - path: packages/git/node-addon/src/git/worktree.rs
    reason: "carries the Git worktree port to Node: its create, remove and prune entries call the driver and decide nothing"
  - path: packages/config/rust/src/bundle.rs
    reason: names the `worktreeSetup` config section in the bundle's section list; it runs nothing
  - path: packages/execution/rust/src/checks.rs
    reason: names `worktreeSetup` in a check message; it provisions nothing
debt:
  - path: src/runner/repo-locks.mjs
    reason: its creation helpers register a checkout through the Git port; their one production caller is unit-handoff, and they are deleted when it moves to the checkout door
  - path: src/workflow/unit-handoff.mjs
    reason: unit handoff creates its checkout through repo-locks; moves to the checkout door when its Node caller is retired
  - path: src/runner/merge.mjs
    reason: Land removes its own candidate checkout through the Git port; it moves with Land
  - path: scripts/lib/git-ports.mjs
    reason: the test launcher prunes registrations of checkouts a test run left behind
retiredBy: "p-nwife3i4kc: the checkout crate gains create at branch/path/base, prune of a missing checkout and remove under held custody; the four Node copies then move onto it"
reason: "only fgos-checkout makes, provisions and removes a linked checkout: it registers and removes through the Git worktree port under the worktree-admin hold, installs dependencies, runs the project's `worktreeSetup.commands` and keeps the provisioning record. A Node or Rust caller reaches it through the addon namespace `checkout` or the `worktree` verb, never by calling the Git create, remove or prune port beside it. Rust test code and comments are blanked and tests/ dirs are pruned; a call split across lines is not seen"
