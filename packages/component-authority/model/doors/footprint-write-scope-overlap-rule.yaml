job: the footprint and write-scope overlap rule
kind: door
patterns:
  - export function pathsOverlap\b
  - \bfootprintOverlapAmong\b
  - \bfn overlaps\(
  - \b(?:writeScopesOverlap|literalsOverlap|globsMeet)\b
  - \bfgos_write_scope::(?:scopes_)?overlaps\b
names:
  - pathsOverlap
allowed:
  - packages/write-scope/src/lib.rs
  - path: packages/git/rust/src/land.rs
    reason: asks the package which landed paths fall inside a footprint
  - src/state/graph-metrics.mjs
  - src/state/graph-harness.mjs
  - src/state/store.mjs
  - src/intake/plan.mjs
  - path: scripts/verify-fanout-overlap.mjs
    reason: "importer of the Work adapter surface: the verifier excludes children whose footprints conflict"
  - path: packages/git/node-addon/src/git/write_scope.rs
    reason: binds the write-scope package's overlap and glob answers to Node (the writeScope namespace); it matches nothing itself
  - src/workflow/propose-classify.mjs
  - src/workflow/propose-validate.mjs
debt:
  - path: src/runner/dispatch/write-scope.mjs
    reason: the JS port of the write-scope rule that dispatch keeps for now (plan decision 6), pinned to the Rust rule by test/git/write-scope-parity.test.mjs; globsMeet and writeScopesOverlap are its overlap functions
retiredBy: dispatch moves onto the write-scope package
reason: whether two footprints or write scopes may touch the same path is the write-scope package's rule (packages/write-scope); a second definition cannot disagree about a pair
