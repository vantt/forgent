job: read runner.capabilities only through src/runner/capability-config.mjs (one function per field) or bind()'s result
kind: door
patterns:
  - (?<!\b(?:contract|payload|fanOutPayload|manifestWithoutDigest|manifest|report|entry|provider|self|a)\??)\.capabilities\b\s*(?:\?\?|\|\||&&|\?\.|\[|\)|;|,|===|!==)
  - \[\s*[\'"]capabilities[\'"]\s*\]
  - \{[^{}]*\bcapabilities\b[^{}]*\}\s*=(?!=)(?!\s*report\b)
allowed:
  - src/runner/capability-config.mjs
reason: the port is the one Node reader of the capabilities section and hands out answers per field, never an entry; the Rust owner is the fgos-execution crate (executor model, bind and decide read the section through the host's config door), which these JS-shaped patterns do not match, and the seat-binding crate is the authority over binding fields
