job: agent hook table
kind: door
patterns:
  - \.claude/settings\.json
  - \.codex/hooks\.json
  - \.agents/hooks\.json
  - fgos-hooks\.ts
  - "['\"]\\.claude['\"],\\s*['\"]settings\\.json['\"]"
  - "['\"]\\.codex['\"],\\s*['\"]hooks\\.json['\"]"
  - "['\"]\\.agents['\"],\\s*['\"]hooks\\.json['\"]"
  - "['\"]extensions['\"],\\s*['\"]fgos-hooks\\.ts['\"]"
  - \["\.claude", "settings\.json"\]
  - \["\.codex", "hooks\.json"\]
  - \["\.agents", "hooks\.json"\]
  - "['\"]hooks\\.json['\"]"
allowed:
  - packages/distribution/rust/src/agent_hooks.rs
  - path: src/run-supervisor/trust-store.mjs
    reason: reads and hashes the Codex hook file's bytes to trust its entries; it writes no hook
  - path: packages/run-supervisor/rust/src/controller/trust_store.rs
    reason: "the Rust twin of trust-store.mjs: reads and hashes the Codex hook file's bytes to trust its entries; it writes no hook. The hook table lives in fgos-distribution (tier 9), which the run supervisor (tier 4) cannot depend on"
  - path: scripts/lib/mailbox-behaviour-v7f.mjs
    reason: "harness-owned frozen experiment: names the hooks.json of the Codex home it builds for a simulated session; not a project hook file"
  - path: scripts/lib/mailbox-behaviour-run.mjs
    reason: "harness-owned: writes the hooks.json of a Codex home it builds for a simulated session, like worker-home.mjs does for a worker; not a project hook file"
  - path: scripts/check-hook-registrations-guarded.mjs
    reason: reads the project's Claude Code settings to check the registered commands; it writes no hook
  - path: scripts/record-mailbox-hook-fixtures.mjs
    reason: the fixture recorder writes its own agy hook file into the workspace it builds, to record what a real CLI sends
  - path: scripts/lib/mailbox-live-cli.mjs
    reason: the live harness lists the agy hook file of a workspace to learn what a CLI sees; it reads only
  - path: src/runner/dispatch/worker-home.mjs
    reason: writes a worker's own settings.json in the worker's home (bypass acceptance), not a project hook file
  - path: packages/execution/engine/src/transport/worker_home.rs
    reason: writes a worker's own settings.json in the worker's home (bypass acceptance), not a project hook file
  - path: core/skills/instruction-audit/scripts/instruction-audit.mjs
    reason: a standalone skill script that audits instruction files, Claude Code's settings among them; it reads only
debt:
  - path: src/setup/agent-hooks.mjs
    reason: the earlier Node table, kept as a frozen measurement input of the mailbox behaviour experiments (its bytes do not change); no doctor row, fix or verb reads it any more; agent_hooks.rs is the owner and the recorded vectors pin both
  - path: scripts/lib/mailbox-live-confined.mjs
    reason: frozen live measurement harness; it lifts the hook rows out of the project and imports the Node table until the mailbox lane re-measures it
retiredBy: the mailbox lane re-measures its frozen experiment sets without the Node hook table; the table goes then
reason: the hook files of the five agent CLIs and the omp/pi extension are rendered, checked and removed from one table (fgos-distribution agent_hooks.rs); the patterns match the file names whole and built in parts. A reader that only reads or hashes a hook file, or writes a worker's own settings, is allowed with its reason
