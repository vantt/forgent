job: parse CLI arguments (twin)
kind: door
patterns:
  - export function parseArgs
  - pub fn parse_args
  - (?:starts_with|strip_prefix)\(\"--\"\)
  - \"--dir\" \| \"--worktree\"
allowed:
  - path: src/cli/parse-args.mjs
    count: 1
  - path: packages/host-runtime/rust/src/cli_args.rs
    count: 5
  - path: apps/fgos/src/routing.rs
    count: 1
    reason: reads the `--flag` part of a store-declaration shape from the registry, not a call
  - path: packages/observe/rust/src/invocation_fault.rs
    count: 1
    reason: judges whether a recorded token has the shape of a flag name; it parses no call
  - path: apps/fgctl/src/help.rs
    count: 1
    reason: fgctl is a separate CLI whose flag grammar takes `--name=value`, which the host grammar does not; its verb tables and help words are its own
  - path: packages/holder-lock/rust/src/route.rs
    count: 2
    reason: "`workspace_argument` judges a worker's argv (`-C` and the `--name=value` spelling, which the host grammar lacks); the route's own flags are read by `fgos_host_runtime::cli_args`"
retiredBy: "S7: the Node twin retires with the last Node verb"
reason: "one parser per language while both CLIs run, proven equal by test/rust-host/fixtures/parse-args-vectors.json. Other readers of `--flag` tokens are debt: each predates the parser and reads its own grammar"
