job: join .fgos onto a project root
kind: door
patterns:
  - path\.join\((?!\s*(?:home|homeDir|os\.homedir\(\))\b)(?:[^()]|\([^()]*\))*'\.fgos'
  - path\.join\((?!\s*(?:home|homeDir|os\.homedir\(\))\b)(?:[^()]|\([^()]*\))*['"]\.fgos/
  - "`[^`]*\\$\\{[^}]+\\}/\\.fgos\\b"
allowed:
  - src/util/fgos-file-registry.mjs
  - path: src/util/host-bin-path.mjs
    reason: "bootstrap: finds the activation before any door can load; the Git one-door scan needs the literal shim path"
  - path: scripts/**
    reason: repo tooling and harnesses build their own fixture projects; not payload
reason: which root is decided by the invocation-root door; the .fgos of that root is joined in one T0 function, so every tier uses the same answer
