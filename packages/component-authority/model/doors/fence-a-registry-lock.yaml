job: fence a registry lock
kind: door
patterns:
  - export function fenceLock\b
  - \bconst TERM_WAIT_MS\b
  - "\\bconst KILL_WAIT_MS(?:: u64)? = 3000\\b"
  - lock-fence-not-confirmed
allowed:
  - path: packages/holder-lock/rust/src/fence.rs
    count: 3
debt: []
reason: the state machine that stops a lock's holders (list, refuse unless confirmed, signal by identity, wait, kill, probe, clear a hot record) is the holder-lock crate's fence.rs; the host verb only reads the call and prints the answer, so no second fence can signal a holder nobody confirmed
