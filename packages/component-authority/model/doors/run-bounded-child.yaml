job: run a bounded child and find a program on the search path
kind: door
patterns:
  - pub fn run_bounded\b
  - pub fn run_bounded_command\b
  - pub fn resolve_program\b
  - \bfn first_on_path\b
  - export function firstOnPath\b
  - std::env::split_paths\(
  - \.try_wait\(\)
allowed:
  - path: packages/process/rust/src/spawn.rs
    count: 4
  - path: apps/fgos-gateway/src/gateway.rs
    count: 1
    reason: watches the gateway child it started (try_wait) for liveness; a long-lived service, not a bounded run
  - path: apps/fgos/src/wiring/run.rs
    count: 1
    reason: watches the admission peer it started (try_wait) for a short grace once the run closed its channel; the peer lives as long as the run
  - path: packages/holder-lock/rust/src/borrow_windows.rs
    count: 1
    reason: watches a long-lived child it started itself (try_wait); not a run-to-completion
  - path: packages/run-supervisor/rust/src/controller/launch.rs
    count: 3
    reason: watches the detached supervisor child it started (try_wait) until it publishes its binding or exits; the supervisor outlives the call
  - path: packages/run-supervisor/rust/src/supervise.rs
    count: 2
    reason: watches the long-lived child it supervises (try_wait); not a run-to-completion
  - path: packages/run-supervisor/rust/src/supervise/windows.rs
    count: 1
    reason: watches the long-lived child it supervises (try_wait); not a run-to-completion
  - path: packages/terminal-control/rust/src/driver/herdr.rs
    count: 1
    reason: watches a long-lived child it started itself (try_wait); not a run-to-completion
  - path: packages/run-supervisor/rust/src/gate/windows.rs
    count: 1
    reason: watches the supervisor gate child it started, ended through its Job Object; a long-lived child, not a bounded run
  - path: packages/host-runtime/rust/src/providers/external_process/bound_invocation_supervisor.rs
    count: 4
    reason: watches the long-lived external-process invocation it started, with its own output limit and cancellation
  - path: packages/process/rust/src/containment/linux.rs
    count: 1
    reason: in the door's own crate; the containment driver polls the contained child it started
  - path: packages/process/rust/src/mapped.rs
    count: 2
    reason: in the door's own crate; the descriptor-mapped spawn searches PATH for its program and polls the child it started; its PATH search joins relative entries to the spawn cwd, checks access(X_OK) and returns EACCES, so it cannot move onto resolve_program without a behaviour change
  - path: packages/distribution/rust/src/init.rs
    count: 1
    reason: a PATH membership test (split_paths) for the launcher directory, not a program lookup
debt:
  - path: packages/git/rust/src/driver.rs
    reason: bounds its own git children with a deadline loop (try_wait); needs a containment hook and an output cap that spawn.rs does not offer
  - path: packages/mailbox/rust/store/src/nudge.rs
    reason: runs the nudge child with its own deadline; needs a descriptor-closing spawn
  - path: packages/run-supervisor/rust/src/steps.rs
    reason: a supervised step led in its own group with the stepTimeoutMs of its envelope; needs a caller-owned Job Object and an output cap
retiredBy: "plans/261121-2110-component-authority-doors/reports/unit-261124-1035-p12b-bounded-child-stop.md; these three retire when one spawn.rs extension (caller-owned containment, output cap, descriptor closing) lands as an owner-chosen feature"
reason: "guards the definitions of run_bounded, resolve_program and firstOnPath, and flags a PATH split or a try_wait child poll outside spawn.rs, so a second bounded spawn or program lookup must be declared. Not covered, by design of a pattern check: an inline Command::new with a deadline loop that polls by some other means. Watching a long-lived child you started (try_wait on a service, supervisor or contained child) is outside this door, so those files are allowed with their measured count. Debt lists the three bounded spawns that need a spawn.rs extension"
