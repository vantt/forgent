job: resolve the invocation root
kind: door
patterns:
  - \bnearestStoreRoot\b
  - \bresolve_target_root\b
  - fn resolve_workspace_root
  - fn resolve_invocation_root
  - pub fn mailbox_fgos_dir
  - export function isMainWorktree
  - for \(let dir = path\.resolve\(cwd\); ; dir = path\.dirname\(dir\)\)
  - join\("\.fgos"\)\.is_dir\(\)
allowed:
  - path: packages/git/rust/src/invocation_root.rs
    count: 6
  - path: packages/git/node-addon/src/git.rs
    count: 1
    reason: the addon entry that carries the door to Node; it decides nothing
debt:
  - path: apps/fgos/src/wiring/mailbox_root.rs
    reason: the mailbox picks its record root (the main checkout from CLAUDE_PROJECT_DIR or the cwd) separately from the invocation root, so a hook call needs no Git process; one door once the mailbox verbs move
  - path: src/util/host-bin-path.mjs
    reason: walks up from cwd for .fgos/installation/activation.json with no Git ceiling and no home exclusion, a root decision of its own for finding the host binary; it is the bootstrap reader, running before any door can load, and retires with the Node payload (S7)
  - path: src/runner/worktree.mjs
    reason: isMainWorktree asks 'is this the main checkout' in Node while fgos-git store_admission asks it in Rust; six other Node callers (resolveMainCheckoutRoot and friends) keep it until their verbs move
retiredBy: "S7 and the mailbox-verb move (apps/fgos/src/wiring/mailbox_verbs.rs): mailbox_root.rs joins the invocation-root door when the mailbox verbs move, host-bin-path.mjs and worktree.mjs retire with the Node payload"
reason: which project and which .fgos a call acts on is decided once, in fgos-git, for Node (through the addon) and the host. Patterns name the definitions of a root decision, not their callers (narrowed from the call names, to cover the same job exactly)
