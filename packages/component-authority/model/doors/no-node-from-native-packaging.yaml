job: no Node from the native packaging verbs
kind: door
patterns:
  - Command::new\("node"\)
  - run_bounded(?:_command)?\(\s*"node"
  - "\\blegacy_exec::"
  - \.arg\("hook"\)
  - "\"hook\"\\.into\\(\\), KIND_"
allowed:
  - path: apps/fgos/src/legacy_exec.rs
    count: 1
    reason: "owns the legacy payload: its resolution, its environment and the one node spawn"
  - path: apps/fgos/src/main.rs
    count: 4
    reason: the legacy lane of the composition root
  - path: apps/fgos/src/invocation_doors.rs
    count: 1
    reason: names the recursion guard variable the detached Event Store child must not inherit
  - path: apps/fgos/src/wiring/gateway_control.rs
    count: 1
    reason: names the recursion guard variable for the gateway child
  - path: apps/fgos/src/wiring/doctor/bridge.rs
    count: 4
    reason: the one bridge to the Node-owned doctor rows
  - path: apps/fgos/src/wiring/run.rs
    count: 1
    reason: fgos run starts the Workflow's admission peer through legacy_exec when the run asks the case admission port, until Workflow admission is Rust
  - path: packages/distribution/rust/src/agent_hooks.rs
    count: 2
    reason: the hook rows' shim probe runs the project's own shim (never Node) with the `hook` route's three kinds and benign input, through the process door; the shim's `hook` route is a legacy-cli route until the hook verdicts are native
debt:
  - path: packages/distribution/rust/src/init.rs
    reason: fgctl's preflight asks the Node on PATH for its version (the release requires Node until the runner moves)
retiredBy: the step that removes requires.node from the release manifest
reason: "the one named allowance is agent_hooks.rs, the hook rows' shim probe, which runs the project shim's `hook` route (dispatch-decide, main-checkout-delete-guard, mailbox), a legacy-cli route until the hook verdicts are native: nothing else under wiring/doctor or in a packaging module may spawn a verb. doctor, init, uninstall and wire-agents never call back into Node for a layer that already moved: only the bridge starts Node, and a row adapter or a packaging module that needs a fact asks the Rust component that owns it"
