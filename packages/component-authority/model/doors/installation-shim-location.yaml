job: installation shim and activation record location
kind: door
patterns:
  - activation\.json
  - "['\"]installation['\"],\\s*['\"]bin['\"]"
  - \.fgos/installation/bin
  - "['\"]\\.fgos['\"],\\s*['\"]installation['\"]"
  - \.join\("installation"\)
allowed:
  - src/util/host-bin-path.mjs
  - packages/distribution/rust/src/init.rs
  - packages/distribution/rust/src/lib.rs
  - path: packages/host-runtime/rust/src/activation.rs
    reason: the shared pure activation-to-host read, used by distribution and live head requests
  - packages/distribution/rust/src/shim.rs
  - packages/distribution/rust/src/uninstall.rs
  - packages/distribution/rust/src/fgctl_refresh.rs
  - path: packages/distribution/rust/src/timer.rs
    reason: names the project shim, or the activated release host, that a managed timer runs; never a checkout script or a PATH lookup
  - apps/fgctl/src/help.rs
  - path: packages/distribution/rust/src/launcher.sh
    reason: "the launcher body the launcher module writes beside fgctl: it reads the nearest activation record from the shell"
  - path: bin/fgos.mjs
    reason: an error message tells the user the shim path to run; it never builds or reads the path
  - path: scripts/check-hook-registrations-guarded.mjs
    reason: the check looks for the shim text inside hook commands, which is the string the hooks carry
  - path: scripts/ci-external-consumer.sh
    reason: the external-consumer proof runs the installed shim the way a consumer's shell does, outside any Node module
  - path: scripts/ci-external-consumer.ps1
    reason: the external-consumer proof asserts the record is absent after a refused install, outside any Node module
  - path: scripts/fgos-shell-integration.sh
    reason: "a shell script the user sources: tests for the shim in the project before it names fgos"
  - path: scripts/lib/mailbox-behaviour-run.mjs
    reason: the behaviour harness spawns the shim of the workspace it builds
  - path: scripts/lib/mailbox-live-confined.mjs
    reason: the live harness writes the activation record of the confined workspace it builds
  - path: scripts/record-mailbox-hook-fixtures.mjs
    reason: the fixture recorder spawns the shim of the workspace it builds
debt:
  - path: packages/herdr-fgos-common/rust/src/fgos.rs
    reason: builds the shim path itself; no step owns the move yet, see backlog row p-rypvkc3kai (a move onto the distribution crate would add a crate edge)
retiredBy: "p-rypvkc3kai: the herdr driver resolves the shim through one door (the Node reader retires separately with the Node payload, S7)"
reason: distribution writes the record and the shim, the host reads them; in Node only host-bin-path knows where they are; core/skills/_shared/fgos-cli-fallback.md names the shim path in prose as a known markdown copy
