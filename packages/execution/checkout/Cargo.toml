[package]
name = "fgos-checkout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Make, provision, remove and resync one linked checkout: the Execution door over the Git worktree port."

[dependencies]
fgos-git = { path = "../../git/rust" }
fgos-process = { path = "../../process/rust" }
fgos-config = { path = "../../config/rust" }
fgos-durable-file = { path = "../../durable-file/rust" }
fgos-holder-lock = { path = "../../holder-lock/rust" }
sha2.workspace = true
# preserve_order: the record keeps the key order Node wrote. raw_value: an identity number is written as the
# digits a JavaScript number prints.
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
