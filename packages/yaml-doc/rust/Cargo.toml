[package]
name = "fgos-yaml-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Insertion order of keys is part of what `Value::from_json` reads; without the feature a per-crate build sorts them.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
# Exact pin; the bytes come from packages/yaml-doc/third-party through the root [patch.crates-io].
saphyr-parser = "=0.2.2"
