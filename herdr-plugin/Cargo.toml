[package]
name = "herdr-fgos"
version = "0.1.0"
edition = "2021"

[lib]
name = "herdr_fgos"
path = "src/lib.rs"

[[bin]]
name = "herdr-fgos"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
