[package]
name = "herdr-dashboard"
version = "0.1.0"
edition = "2021"

[lib]
name = "herdr_dashboard"
path = "src/lib.rs"

[[bin]]
name = "herdr-dashboard"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
herdr-fgos-common = { path = "../packages/herdr-fgos-common/rust" }
