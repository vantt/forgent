format: 1
cases:
  - id: "vi-en-01-g01"
    query: "Approve keeps reporting that it is blocked because the worker branch has changes in .fgos, but in fact the worker never touched it; main only changed the config after the branch was split off. After running catchup and approving again, the exact same old error comes back, looping forever without getting out."
    expect:
      - {path: "docs/explanation/fgos-write-rejected-structural-deadlock.md", section: ["## The mechanism"]}
      - {path: "docs/explanation/write-rejected-trust-branchheadattake.md", section: ["# A worker branch that never touched `.fgos/` still got blocked as if it had"]}
      - {path: "docs/explanation/write-rejected-no-diff-check.md", section: ["## The gap blob-equality couldn't cover"]}
  - id: "vi-en-02-g02"
    query: "Items are lost again: yesterday the list still showed them, but now grep in the event log file finds no lines. Suspect some session ran stash or reset in the main checkout while other sessions were still writing to it."
    expect:
      - {path: "docs/explanation/events-jsonl-concurrent-data-loss-investigation.md", section: ["## The evidence: not a one-off"]}
      - {path: "docs/explanation/events-jsonl-opportunistic-truncation-check.md", section: ["## Detect-and-warn wasn't enough to actually recover — `tsk-46v` added the remediation path"]}
      - {path: "docs/knowledge/how-to-respond-when-fgos-doctor-reports-a-shared-fgos-events/resolve-an-events-jsonl-truncation.md", section: ["## Why this is different from a merge-conflict break"]}
      - {path: "docs/knowledge/how-to-reconstruct-fgos-tracking-state-after-an-operator-mis/reconstruct-fgos-tracking-state-after-an-operator-mistake-discards-events-jsonl.md", section: ["# How to reconstruct fgOS tracking state after an operator mistake discards `.fgos/events.jsonl` mid-session"]}
  - id: "vi-en-03-g04"
    query: "pick is refused with exit 7 because the lock on the main checkout is being held. Before deleting the lock, check whether the holder is still alive, whether it has expired yet, or whether to just wait for it to finish."
    expect:
      - {path: "docs/knowledge/how-to-clear-a-stuck-fgos-main-checkout-lock/clear-a-stuck-main-checkout-lock.md", section: ["## Steps"]}
      - {path: "docs/knowledge/how-to-check-main-checkout-lock-status-before-retrying/check-main-checkout-lock-status-before-retrying.md", section: ["## Steps"]}
      - {path: "docs/knowledge/how-to-wait-out-a-genuinely-active-main-checkout-lock-holder/wait-out-an-active-main-checkout-lock-holder.md", section: ["## Steps"]}
  - id: "vi-en-04-g06"
    query: "After every commit, the main lock stays hung for several more minutes because the pre-commit hook does not release it, making other sessions wait unnecessarily."
    expect:
      - {path: "docs/knowledge/why-acquiremaincheckoutlock-s-release-on-exit-is-opt-in-neve/main-checkout-lock-release-on-exit-opt-in.md", section: ["## The two callers, and why they disagree"]}
      - {path: "docs/knowledge/why-the-pre-commit-hook-got-its-own-shorter-main-checkout-lo/why-the-pre-commit-hook-got-its-own-shorter-lock-ttl.md", section: ["## The real cost of one shared TTL"]}
      - {path: "docs/explanation/main-checkout-lock-release-early-compound-cleanup.md", section: ["## Root cause, confirmed via code trace"]}
  - id: "vi-en-05-g07"
    query: "While inside a worktree, running an fgos run command containing $(cat file prompt) gets blocked by the Bash guard, which says the command is too complex to verify. The way around it is to write a wrapper script and then call that script."
    expect:
