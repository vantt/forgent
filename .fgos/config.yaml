# @fgos:v1
# see: fgos config standard

# @fgos:doc Which orchestration steps the herdr launcher starts by itself.
herdrOrchestrator:
  # @fgos:doc When true the launcher starts the discover step on its own. Default: false.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  autoDiscover: true
# @fgos:doc The runner: executors, capabilities, model policies, tier fallback, patterns and run limits.
# nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote
# mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ
# standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả
# advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan
# flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel
# frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
runner:
  # @fgos:doc The capability catalog: what each capability is called, which executors serve it and how it is held.
  capabilities:
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    impact-analysis:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer: gitnexus
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    advise:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"claude","invocation":"claude-cli-bwrap"},{"executor":"openai","invocation":"codex-cli-bwrap"}].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: claude
          invocation: claude-cli-bwrap
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    execute:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    fgos-coding-implement:
      # @fgos:doc What the capability is for.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      description: code-implement work for the coding domain executing stage -- preferred executor gemini through omp (omp-gemini-tetcu72), claude as fallback.
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini","invocation":"omp-herdr"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
          invocation: omp-herdr
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    code:implement:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini","invocation":"omp-herdr"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
          invocation: omp-herdr
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    code:test:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    code:refactor:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    coding:implement:
      # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: [{"executor":"gemini","invocation":"omp-herdr"},{"executor":"deepseek"},{"executor":"glm"},"claude","openai"].
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      prefer:
        - executor: gemini
          invocation: omp-herdr
        - executor: deepseek
        - executor: glm
        - claude
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    code:*:
      # @fgos:doc Per-role tier and executor taste; a role is producer, synthesizer, reviewer, red-team or judge.
      roles:
        # @fgos:doc The tier and executors one role, persona or seat prefers.
        red-team:
          # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: ["xai","claude","openai"].
          # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] COOK 2026-10-26: reviewer seats prefer xai, so a red-team seat limited to xai has no independent family at high rigor and the round settled independence-unsatisfiable (unit-run-1792987741620-ae5ebf3f). Putting openai first gives producer, reviewer, red-team three families. Unset or restore [xai] if openai seats stall.
          prefer:
            - openai
            - xai
        # @fgos:doc The tier and executors one role, persona or seat prefers.
        reviewer:
          # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider.
          # @fgos:why [e0397c00-5319-463e-8e23-86031fbc824b] Owner 2026-10-25 21:44 chose (a): deepseek reviewer seats stalled or hit 402 in 4 of 5 rounds of the Part A case (evidence-261025-2126-cook-reviewer-seat-stalls.md); claude read-only seats write no outbox; xai finished every round. Unset when HARDEN lands the pi stall detection.
          prefer:
            - xai
            - openai
    # @fgos:doc One capability: what it is called, which executors serve it and how work on it is held.
    marketing:*:
      # @fgos:doc Per-role tier and executor taste; a role is producer, synthesizer, reviewer, red-team or judge.
      roles:
        # @fgos:doc The tier and executors one role, persona or seat prefers.
        red-team:
          # @fgos:doc Executors a seat may use, in order: one executor id, or a list whose entries are an id or an object naming an executor, one of its invocation ids and whether it may cross provider. Default: ["claude","openai"].
          # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
          prefer:
            - claude
  # @fgos:doc The executor registry: every executor a seat can be bound to, by id.
  executors:
    # @fgos:doc One executor: an agent that runs work or a tool that is only present, with the invocations that start it.
    gitnexus:
      # @fgos:doc agent runs work for a seat, tool is only called. Values: agent | tool.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      kind: tool
      # @fgos:doc What the executor is and how its invocations differ.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      description: Code-graph blast radius
      # @fgos:doc Capabilities a tool serves.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      for:
        - impact-analysis
      # @fgos:doc Directory a tool scans.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      scanTarget: .gitnexus
      # @fgos:doc The responsibility a tool fills.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      responsibility: Verification
    # @fgos:doc One executor: an agent that runs work or a tool that is only present, with the invocations that start it.
    herdr:
      # @fgos:doc agent runs work for a seat, tool is only called. Values: agent | tool.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      kind: tool
      # @fgos:doc Capabilities a tool serves.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      for:
        - pane-labeling
      # @fgos:doc The responsibility a tool fills.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      responsibility: Chrome
      # @fgos:doc What the executor is and how its invocations differ.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      description: herdr pane label writer (herdr pane rename) for /fgOS:terminal
    # @fgos:doc One executor: an agent that runs work or a tool that is only present, with the invocations that start it.
    gemini:
      # @fgos:doc What the executor is and how its invocations differ.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      description: "Gemini provider via omp (oh-my-pi) on the gemini-tetcu72 profile; Antigravity CLI (agy) invocations removed 2026-10-16 (agy not installed, owner chose omp). Invocations: omp-gemini-tetcu72 (herdr pane), omp-cli-bwrap-gemini-tetcu72 (headless). The confined account comes from runner.providers.gemini.accounts in the global config."
    # @fgos:doc One executor: an agent that runs work or a tool that is only present, with the invocations that start it.
    xai:
      # @fgos:doc What the executor is and how its invocations differ.
      # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
      description: xai (Grok) provider via omp CLI (oh-my-pi, a pi fork) with the xai-vantt profile; replaces the pi grok-vantt login that kept needing re-OAuth. omp reads the profile through PI_CODING_AGENT_DIR like pi does. PI_CONFIG_DIR is a path relative to HOME that lands in /tmp, because omp writes a runtime directory under its config root and the confined home is read-only. omp uses glob instead of ls/find. The account files are declared in the user-level ~/.fgos/config.json (providers.xai).
  # @fgos:doc Milliseconds one run may take before it is stopped. Maximum: 14400000. Default: 900000.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  timeoutMs: 2100000
  # @fgos:doc The highest tier any seat may run at; absent means no ceiling. Values: nano | mini | standard | advanced | flagship | frontier.
  # @fgos:doc Tier ladder, weakest first:
  # @fgos:doc nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote
  # @fgos:doc mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ
  # @fgos:doc standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả
  # @fgos:doc advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan
  # @fgos:doc flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel
  # @fgos:doc frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  maxTier: flagship
  # @fgos:doc Generated trees a unit write scope widens to when it touches their source. Default: [].
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  generatedPaths:
    - from: core/skills/**
      also:
        - .agents/skills/**
        - plugins/fgOS/skills/**
        - .claude/skills/**
  # @fgos:doc Milliseconds of silence after which a worker is stopped; absent leaves idle stopping off.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  idleTimeoutMs: 5400000
  # @fgos:doc The model each family uses at each tier, by family then tier.
  # @fgos:doc Tier ladder, weakest first:
  # @fgos:doc nano: cơ học, không suy luận; self-check: chỉ nhận ra hoặc biến đổi theo mẫu?; e.g. classify, extract, format, route, vote
  # @fgos:doc mini: suy luận nhẹ trên đầu vào cho sẵn, phạm vi hẹp; self-check: đủ thông tin, chỉ hiểu và tóm tắt?; e.g. tóm tắt, trả lời từ tài liệu cho, sửa nhỏ chính xác, review diff nhỏ
  # @fgos:doc standard: theo một kế hoạch có sẵn, nhiều bước; self-check: có kế hoạch và hướng dẫn chi tiết?; e.g. code theo plan, viết test, refactor theo mô tả
  # @fgos:doc advanced: tự tìm đường, không có đáp án sẵn; self-check: phải điều tra và quyết cách làm?; e.g. debug khó, code phức tạp, nhiều file không có plan
  # @fgos:doc flagship: phán đoán, thiết kế, phê bình; self-check: kết quả là một ý kiến hay một thiết kế?; e.g. review, red-team, thiết kế giải pháp, synthesis của panel
  # @fgos:doc frontier: quyết định đắt nhất; self-check: khó đảo, đắt nếu sai?; e.g. khoá kiến trúc, synthesis cuối của hội đồng quan trọng
  modelPolicies:
    # @fgos:doc The tiers of one family; a tier it omits has no model.
    deepseek:
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: deepseek/deepseek-v4-pro@openrouter.
      # @fgos:why [e0397c00-5319-463e-8e23-86031fbc824b] Owner 2026-10-25: run deepseek's advanced seat on v4.1-flash through thehive first, OpenRouter as fallback; v4-pro on OpenRouter ran out of credit (402) on a plan-driven review
      advanced:
        - thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive
        - deepseek/deepseek-v4.1-flash@openrouter
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: deepseek/deepseek-v4-pro@openrouter.
      # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] Owner 2026-11-09: no pro on OpenRouter for any seat; flagship/frontier councils, reviews and synthesis run deepseek and glm on flash through thehive first, OpenRouter flash as fallback; v4-pro and full glm-5.3 spent the OpenRouter credit
      flagship:
        - thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive
        - deepseek/deepseek-v4.1-flash@openrouter
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: deepseek/deepseek-v4-pro@openrouter.
      # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] Owner 2026-11-09: no pro on OpenRouter for any seat; flagship/frontier councils, reviews and synthesis run deepseek and glm on flash through thehive first, OpenRouter flash as fallback; v4-pro and full glm-5.3 spent the OpenRouter credit
      frontier:
        - thehive/deepseek-ai/deepseek-v4.1-flash-1017@thehive
        - deepseek/deepseek-v4.1-flash@openrouter
    # @fgos:doc The tiers of one family; a tier it omits has no model.
    z-ai:
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: z-ai/glm-5.3@openrouter.
      # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] Owner 2026-11-09: no pro on OpenRouter for any seat; flagship/frontier councils, reviews and synthesis run deepseek and glm on flash through thehive first, OpenRouter flash as fallback; v4-pro and full glm-5.3 spent the OpenRouter credit
      advanced:
        - thehive/zai-org/glm-5.3-flash@thehive
        - z-ai/glm-5.3-flash@openrouter
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: z-ai/glm-5.3@openrouter.
      # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] Owner 2026-11-09: no pro on OpenRouter for any seat; flagship/frontier councils, reviews and synthesis run deepseek and glm on flash through thehive first, OpenRouter flash as fallback; v4-pro and full glm-5.3 spent the OpenRouter credit
      flagship:
        - thehive/zai-org/glm-5.3-flash@thehive
        - z-ai/glm-5.3-flash@openrouter
      # @fgos:doc The model a family uses at one tier: a model id, model@pool, an object with model, pool and effort, or a non-empty list of those in the order they are tried. A cell is replaced whole by a higher layer, never merged. Default: z-ai/glm-5.3@openrouter.
      # @fgos:why [6be6fc05-6e06-43af-a3f3-07eb170ce533] Owner 2026-11-09: no pro on OpenRouter for any seat; flagship/frontier councils, reviews and synthesis run deepseek and glm on flash through thehive first, OpenRouter flash as fallback; v4-pro and full glm-5.3 spent the OpenRouter credit
      frontier:
        - thehive/zai-org/glm-5.3-flash@thehive
        - z-ai/glm-5.3-flash@openrouter
# @fgos:doc How far agent work may skip human approval gates.
gateBypass:
  # @fgos:doc Gate bypass level for agent work; off approves nothing automatically and each higher level approves work up to that size. Values: off | light | standard | heavy. Default: off.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  level: standard
# @fgos:doc When delivered work items have their worktree and branch reclaimed.
cleanup:
  # @fgos:doc Days a delivered root work item waits before the cleanup stage reclaims its worktree and branch. Default: 7.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  ttlDays: 5
# @fgos:doc Shell commands that must pass before work returns or merges.
invariantChecks:
  # @fgos:doc Shell commands run at return and merge; each must exit 0, and an empty list runs no check. Default: [].
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  commands:
    - node scripts/run-tests.mjs test/architecture.test.mjs
# @fgos:doc Whether the end-user docs index is enforced.
docRegistry:
  # @fgos:doc When true a stale end-user docs index fails the gate; when false it is only reported. Default: false.
  # @fgos:why [9548be33-0b94-4fe0-b02c-5d5eb0240a61] [migrate] carried over from config.json, reason never recorded
  enforce: true
# @fgos:doc Limits of the agent mailbox, and whether a project opts in to its hooks.
mailbox:
  # @fgos:doc Whether fgos setup and doctor --fix install the mailbox hook rows into this project's Claude Code and Codex hook files; false removes the rows they installed. On by default (owner decision 2026-10-28): a project opts out with mailbox.enabled: false. Default: true.
  # @fgos:why [9514b261-1778-4cbd-a231-bec51e3e04d9] owner 2026-10-25: turn the agent mailbox on for the forgent project
  enabled: true
  # @fgos:doc Delivery of mail between machines, through the Event Store and the project's Git remote.
  crossMachine:
    # @fgos:doc Whether this project's mailbox sends mail to, and takes mail from, sessions on other machines. Off until the two-machine proof has passed on every machine. Default: false.
    # @fgos:why [9514b261-1778-4cbd-a231-bec51e3e04d9] cross-machine mail live proof (owner: install through fg-server, guide 261030-0331)
    enabled: true
  # @fgos:doc Rules for mail that arrives from another machine.
  remote:
    # @fgos:doc Whether a message to another machine leaves its body out of the signed event: the body is written to this machine's mail-body ref and pushed before the event is recorded, and the event carries the body's hash and length (payload version 3). Turn it on only when every machine of the project runs a build that takes version 3 (fgos mailbox status names the versions each takes); an older receiver drops such mail. Default: false.
    # @fgos:why [d1289d42-7a12-4c3e-a3bc-dc1d687aaf99] owner 2026-11-08: bật thường trực trên cả ba máy, dọn tay khi tắt; fg-server2, fg-server, design-lap đều chạy bản có 2d43cdf23
    bodyRef: true
# @fgos:doc Remote, timers and retry limit of the event store.
eventStore:
  # @fgos:doc The sync timer of the event store.
  sync:
    # @fgos:doc Seconds between syncs with the remote; 0 turns the timer off. Minimum: 0. Default: 300.
    # @fgos:why [d1289d42-7a12-4c3e-a3bc-dc1d687aaf99] owner 2026-11-06: cross-machine mail should arrive in about a minute; an empty fetch measured 0.64 s
    intervalSec: 60
